<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dos Bastidores à Transformação</title>
<style>
/* Fontes locais: carregadas antes do quadro 0 (ver window.ready) */
@font-face { font-family: "Inter"; font-weight: 500; src: url("assets/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 800; src: url("assets/inter-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "JBMono"; font-weight: 500; src: url("assets/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "JBMono"; font-weight: 700; src: url("assets/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }

/* Paleta do briefing: só estas 4 cores */
:root { --bg: #1F1D2B; --text: #F4F4F9; --accent: #FF7551; --support: #8B7CF6; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

/* Palco: 1080x1920. Área segura: 65 px nas laterais, 115 px no topo e 20% livres na base (y > 1536). */
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; }
#grid { position: absolute; inset: 0; }
.block { position: absolute; left: 65px; right: 65px; top: 0; height: 1536px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; opacity: 0; }
.sup { font-weight: 500; font-size: 46px; letter-spacing: 0.02em; text-transform: uppercase; }
.title { font-weight: 800; font-size: 100px; line-height: 1.02; letter-spacing: -0.02em; text-transform: uppercase; }
.title .w { display: inline-block; }
.mono { font-family: "JBMono", monospace; }
.accent { color: var(--accent); }
.support { color: var(--support); }

/* Bloco 1: máquina de escrever */
#tw { font-weight: 500; font-size: 72px; letter-spacing: 0.02em; white-space: pre; }
#cursor { display: inline-block; width: 0.6em; height: 1em; background: var(--text); vertical-align: -0.12em; margin-left: 4px; }
/* Bloco 3: texto decodificado */
.dec { font-weight: 700; font-size: 92px; letter-spacing: 0; white-space: pre; line-height: 1.05; }
/* Bloco 5 */
#rule { width: 0; height: 4px; background: var(--text); border-radius: 2px; }
#hoje { font-weight: 800; font-size: 230px; line-height: 1; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="grid" width="1080" height="1920"></canvas>

  <div class="block" id="b1"><div class="mono"><span id="tw"></span><span id="cursor"></span></div></div>

  <div class="block" id="b2">
    <div class="sup" id="b2a">O público via</div>
    <div class="title" id="b2b"><span class="w">os</span> <span class="w accent">resultados.</span></div>
  </div>

  <div class="block" id="b3">
    <div class="sup" id="b3a">Mas existia</div>
    <div class="mono dec" id="d1"></div>
    <div class="mono dec" id="d2"></div>
  </div>

  <div class="block" id="b4">
    <div class="sup" id="b4a">Nem toda história</div>
    <div class="title" id="b4b"><span class="w">deve</span> <span class="w">ficar</span><br><span class="w">escondida.</span></div>
  </div>

  <div class="block" id="b5" style="gap:22px">
    <div class="sup" id="b5a">Dos bastidores</div>
    <div class="title" id="b5b" style="font-size:86px"><span class="w">à</span> <span class="w">transformação</span></div>
    <div id="rule"></div>
    <div id="hoje" class="accent">HOJE.</div>
    <div class="sup support" id="b5d" style="text-transform:none;font-size:44px">Uma nova fase começa.</div>
  </div>
</div>

<script src="assets/gsap.min.js"></script>
<script>
/* ===== Constantes e utilidades determinísticas ===== */
const FPS = 30, DURATION = 18;
const C = { text: "#F4F4F9", accent: "#FF7551", support: "#8B7CF6" };
const $ = (id) => document.getElementById(id);

// Gerador com semente fixa (mulberry32). Sempre recriado a partir de uma semente derivada do quadro.
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SYMBOLS = "#%&$@*+=<>/\\|{}[]?!01";

const tl = gsap.timeline({ paused: true });
const frameAt = () => Math.round(tl.time() * FPS);     // quadro atual, derivado só do tempo da timeline
const IN = "expo.out", OUT = "expo.in";                 // easing padrão do briefing

/* ===== BLOCO 1 (0,00–3,00 s): máquina de escrever ===== */
const TW_TEXT = "DURANTE MUITO TEMPO…";
const tw = { n: 0 };
tl.set("#b1", { opacity: 1 }, 0)
  .set("#cursor", { opacity: 1 }, 0.1)
  // 20 car/s, sem vírgulas no texto (pausa de 300 ms não se aplica)
  .to(tw, { n: TW_TEXT.length, duration: TW_TEXT.length / 20, ease: "none",
            onUpdate: () => { $("tw").textContent = TW_TEXT.slice(0, Math.floor(tw.n)); } }, 0.4)
  // terminou em 1,40 s: pisca 2 vezes (meio período de 250 ms = ciclo de 500 ms) e some
  .set("#cursor", { opacity: 0 }, 1.65).set("#cursor", { opacity: 1 }, 1.90)
  .set("#cursor", { opacity: 0 }, 2.15).set("#cursor", { opacity: 1 }, 2.40)
  .set("#cursor", { opacity: 0 }, 2.65)
  .to("#b1", { y: -60, opacity: 0, duration: 0.35, ease: OUT }, 2.62);

/* ===== BLOCO 2 (3,00–6,40 s): entrada cinética padrão ===== */
tl.set("#b2", { opacity: 1 }, 3.0)
  .from("#b2a", { y: 60, opacity: 0, duration: 0.5, ease: IN }, 3.0)
  .from("#b2b .w", { y: 70, scale: 0.8, opacity: 0, duration: 0.5, ease: IN, stagger: 0.06, transformOrigin: "50% 100%" }, 3.35)
  .to("#b2", { y: -60, opacity: 0, duration: 0.35, ease: OUT }, 6.0);

/* ===== BLOCO 3 (6,40–10,00 s): texto decodificado ===== */
function decode(el, finalText, p) {
  // p de 0 a 1 em 800 ms; resolve da esquerda para a direita. Símbolos trocam a cada 2 quadros.
  const resolved = Math.floor(p * finalText.length + 1e-6);
  const step = Math.floor(frameAt() / 2);
  const rng = mulberry32(42 + step * 7919 + finalText.length * 31);
  let html = "";
  for (let i = 0; i < finalText.length; i++) {
    const ch = finalText[i], r = SYMBOLS[Math.floor(rng() * SYMBOLS.length)];
    if (ch === " ") { html += " "; continue; }
    html += i < resolved ? ch : `<span style="color:${C.accent}">${r}</span>`;
  }
  el.innerHTML = html;
}
const D1 = "UMA HISTÓRIA", D2 = "POR TRÁS.";
const p1 = { p: 0 }, p2 = { p: 0 };
tl.set("#b3", { opacity: 1 }, 6.4)
  .set("#d1", { opacity: 0 }, 0).set("#d2", { opacity: 0 }, 0)
  .from("#b3a", { y: 50, opacity: 0, duration: 0.45, ease: IN }, 6.45)
  .set("#d1", { opacity: 1 }, 6.8)
  .to(p1, { p: 1, duration: 0.8, ease: "none", onUpdate: () => decode($("d1"), D1, p1.p) }, 6.8)
  .set("#d2", { opacity: 1 }, 7.5)
  .to(p2, { p: 1, duration: 0.8, ease: "none", onUpdate: () => decode($("d2"), D2, p2.p) }, 7.5)
  .to("#b3", { y: -60, opacity: 0, duration: 0.35, ease: OUT }, 9.6);

/* ===== GRADE EM ONDA (10,00–18,00 s) ===== */
const g = { t: 0, a: 0 };
const ctx = $("grid").getContext("2d");
function drawGrid() {
  ctx.clearRect(0, 0, 1080, 1920);
  if (g.a <= 0.001) return;
  const S = 32, cx = 540, cy = 860;
  ctx.fillStyle = C.support;
  for (let y = S / 2; y < 1920; y += S) for (let x = S / 2; x < 1080; x += S) {
    const d = Math.hypot(x - cx, y - cy) / S;               // distância em células
    const w = Math.sin(g.t * 2 * Math.PI - d * 0.15);       // fórmula do briefing
    const sc = 1 + 0.6 * w;
    ctx.globalAlpha = g.a * (0.18 + 0.32 * (w + 1) / 2);
    ctx.beginPath(); ctx.arc(x, y, 2.6 * sc, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// t avança 1 unidade por segundo (onda de 1 Hz); a opacidade entra, assenta e cai para 35%
tl.to(g, { t: 8, duration: 8, ease: "none", onUpdate: drawGrid }, 10.0)
  .to(g, { a: 1, duration: 0.6, ease: IN, onUpdate: drawGrid }, 10.0)
  .to(g, { a: 0.35, duration: 0.6, ease: "power2.inOut", onUpdate: drawGrid }, 13.2);

/* ===== BLOCO 4 (10,00–13,60 s): grade + entrada cinética ===== */
tl.set("#b4", { opacity: 1 }, 10.4)
  .from("#b4a", { y: 60, opacity: 0, duration: 0.5, ease: IN }, 10.4)
  .from("#b4b .w", { y: 70, scale: 0.8, opacity: 0, duration: 0.5, ease: IN, stagger: 0.06, transformOrigin: "50% 100%" }, 10.7)
  .to("#b4", { y: -60, opacity: 0, duration: 0.35, ease: OUT }, 13.2);

/* ===== BLOCO 5 (13,60–18,00 s): revelação ===== */
tl.set("#b5", { opacity: 1 }, 13.8)
  .from("#b5a", { y: 50, opacity: 0, duration: 0.5, ease: IN }, 13.8)
  .from("#b5b .w", { y: 70, scale: 0.8, opacity: 0, duration: 0.5, ease: IN, stagger: 0.06, transformOrigin: "50% 100%" }, 14.1)
  .to("#rule", { width: 520, duration: 0.6, ease: IN }, 14.6)
  // ênfase (um nível acima): 110% para 100%
  .from("#hoje", { scale: 1.1, opacity: 0, duration: 0.6, ease: IN }, 15.2)
  .from("#b5d", { y: 40, opacity: 0, duration: 0.5, ease: IN }, 15.9)
  // garante que a timeline tenha exatamente 18 s (corte seco no fim)
  .set({}, {}, DURATION);

/* ===== API de render ===== */
window.DURATION = DURATION; window.FPS = FPS;
window.ready = Promise.all([
  document.fonts.load('500 46px "Inter"'), document.fonts.load('800 100px "Inter"'),
  document.fonts.load('500 72px "JBMono"'), document.fonts.load('700 92px "JBMono"'),
]).then(() => document.fonts.ready).then(() => { tl.seek(0, false); return true; });
window.seek = (t) => { tl.seek(t, false); };
</script>
</body>
</html>
