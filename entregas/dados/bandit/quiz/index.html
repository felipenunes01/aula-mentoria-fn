  GA4_ID:          'TODO',
  N8N_WEBHOOK_URL: 'TODO',

  /* o lead entra no Falume por este endpoint do próprio Worker */

  /* PRECO: valor provisorio, o Carlos ainda nao fechou.
     Trocar aqui muda a oferta inteira, nao ha preco escrito no HTML. */

     percentual de desconto sao calculados a partir dele e da soma do stack,

     A soma aparece na pagina, entao mexer aqui muda a ancoragem. */

     Formato: [{ n:'83%', txt:'...', fonte:'...' }] */

    { n:'R$ 22 milhões', txt:'vendidos com quiz na operação de lançamentos do Pablo Marçal.',

      fonte:'' }
  ],

  DEBUG: false
};
</script>

<style>
:root{
  color-scheme: dark;
  --deep:#0A0F0A; --halo:#16351B;
  --card:#131C14; --card2:#1A2620; --line:#27332A; --line2:#35443A;
  --yel:#FFD200; --yel2:#FFA800; --yel-soft:rgba(255,210,0,.12); --on-yel:#0A0F0A;
  --txt:#F2F0E6; --txt2:#A6AFA6; --txt3:#748076;
  --red:#FF6B5A; --grn:#5FCF8A;
  --r:18px;
  --fd:"Sora",system-ui,-apple-system,sans-serif;
  --ft:"Manrope",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ft); color:var(--txt); font-size:16px; line-height:1.45;
  background:
    radial-gradient(120% 70% at 12% 0%, rgba(22,53,27,.9) 0%, rgba(10,15,10,0) 58%),
    radial-gradient(90% 60% at 95% 100%, rgba(22,53,27,.55) 0%, rgba(10,15,10,0) 55%),
    var(--deep);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.14;letter-spacing:-.03em;
  font-weight:600;text-wrap:balance}
h1{font-size:clamp(25px,6.4vw,34px);font-weight:800}
h2{font-size:clamp(20px,5.2vw,27px)}
h3{font-size:clamp(17px,4.4vw,21px)}
p{margin:0;color:var(--txt2)}
b{color:var(--txt)}
em{font-style:normal;color:var(--yel)}
.hide{display:none!important}

/* ---------- topo ---------- */
#topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:rgba(10,15,10,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
/* uma barra so: voltar, progresso, passo e o cofre dividem a mesma linha.
   Duas barras empilhadas comiam 84px do alto da tela, que e o espaco que o
   video precisa pra caber junto com o botao fixo. */
/* nada de position:relative aqui: a regra sobrescrevia o position:sticky
   de cima e o cabecalho parava de grudar no topo ao rolar. O sticky ja
   serve de referencia pro .barra posicionado por absolute. */
.topo-in{max-width:560px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:9px}
/* so a seta: com a palavra "Voltar" nao sobrava largura pra barra de
   progresso depois que o cofre entrou na mesma linha */
#voltar{background:0;border:0;padding:6px 2px;color:var(--txt3);font-size:17px;
  line-height:1;font-family:var(--fd);cursor:pointer;flex:0 0 auto}
/* na capa nao ha pra onde voltar, mas o espaco fica guardado pra barra nao
   pular de largura quando o botao aparece na pergunta seguinte */
#voltar.hide{display:inline-block!important;visibility:hidden}
#voltar:hover{color:var(--txt)}
/* o progresso deixou de disputar largura com o resto: virou o filete do
   rodape do cabecalho, na largura inteira da tela. Assim o rotulo "Seus
   presentes" cabe na linha sem espremer nada. */
.barra{position:absolute;left:0;right:0;bottom:0;height:3px;background:#101A12;overflow:hidden}
.barra i{display:block;height:100%;width:3%;
  background:linear-gradient(90deg,var(--yel2),var(--yel));transition:width .45s cubic-bezier(.22,1,.36,1)}

/* ---------- palco ---------- */
.wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 16px 48px}
/* espaco no pe pra nada ficar escondido atras da barra fixa */
body.com-barra .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#tela{display:flex;flex-direction:column;gap:16px;animation:entra .32s cubic-bezier(.16,1,.3,1) both}
/* 16/10: o conteudo fica no meio da altura, e nao colado no topo. A abertura
   do case, os videos e a oferta tem desenho proprio e ficam de fora. */
body.centro #tela{min-height:calc(100svh - var(--topo-h,52px) - 68px);justify-content:center;
  padding-bottom:4vh}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ #tela{animation:none} }

.selo{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  padding:6px 13px;border-radius:99px;background:var(--yel-soft);
  border:1px solid rgba(255,210,0,.4);color:var(--yel);
  font-family:var(--fd);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.selo i{width:6px;height:6px;border-radius:50%;background:var(--yel);
  animation:pisca 1.5s infinite;font-style:normal}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
.qnum{font-family:var(--fd);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--txt3)}
.peq{font-size:14px;color:var(--txt2)}

/* ---------- opcoes ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 14px;border-radius:15px;background:var(--card);
  border:1.5px solid var(--line);font-size:15px;font-weight:600;color:var(--txt);
  cursor:pointer;position:relative;
  transition:transform .18s,border-color .2s,background .2s,box-shadow .25s}
.opt .em{font-size:22px;line-height:1;flex:0 0 auto;transition:transform .25s}
.opt .tx{flex:1;min-width:0}
.opt .go{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line2);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;transition:.2s}
/* 16/10: hover so onde existe mouse. No celular o :hover "gruda" depois do
   toque e a opcao na mesma altura da pergunta seguinte ja aparecia marcada */
@media (hover:hover) and (pointer:fine){
  .opt:hover{border-color:rgba(255,210,0,.55);transform:translateX(4px);background:var(--card2)}
  .opt:hover .em{transform:scale(1.14) rotate(-6deg)}
}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
.opt.on{background:linear-gradient(100deg,var(--yel),var(--yel2));color:var(--on-yel);
  border-color:var(--yel);transform:translateX(0) scale(1.015);
  box-shadow:0 12px 30px rgba(255,180,0,.3)}
.opt.on .go{border-color:var(--on-yel);background:var(--on-yel);color:var(--yel)}
.opt.on .em{transform:scale(1.22)}
@media (prefers-reduced-motion: reduce){ .opt,.opt .em{transition:none} }

/* ---------- capa com as duas fotos ---------- */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fcard{border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
  font-weight:700;font-size:15px;color:var(--txt);
  transition:border-color .2s,background .2s,transform .2s}
@media (hover:hover) and (pointer:fine){
  .fcard:hover{border-color:rgba(255,210,0,.55);background:var(--card2);transform:translateY(-3px)}
}
.fcard:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
.fcard.on{border-color:var(--yel);
  background:linear-gradient(160deg,rgba(255,210,0,.16),var(--card) 62%)}
/* moldura de busto: o boneco vai do cabelo ate os bracos cruzados, entao a
   caixa e so um pouco mais alta que larga. Num circulo o cabelo da mulher
   seria cortado dos dois lados. object-fit:contain com largura E altura em
   100%, porque height:100% sozinho nao resolve dentro de uma caixa com
   aspect-ratio e a imagem acaba cortada. */
.fcard .ret{position:relative;width:100%;aspect-ratio:4/5;border-radius:12px;
  overflow:hidden;display:grid;place-items:center;font-size:44px}
/* a imagem e posicionada por inset, nao por height:100%: altura em
   porcentagem nao resolve contra uma altura que veio de aspect-ratio, e a
   imagem estourava a moldura (379px numa caixa de 202) e saia cortada */
.fcard .ret img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center bottom;display:block}

/* ---------- botoes ---------- */
.btn{border:0;border-radius:15px;padding:17px 14px;width:100%;cursor:pointer;
  font-family:var(--fd);font-size:15.5px;font-weight:600;color:var(--on-yel);
  background:linear-gradient(100deg,var(--yel),var(--yel2));
  box-shadow:0 12px 30px rgba(255,180,0,.26);
  position:relative;overflow:hidden;transition:transform .16s,box-shadow .25s}
.btn:active{transform:scale(.975)}
.btn:focus-visible{outline:2px solid var(--txt);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:70px;left:-90px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);
  animation:brilho 2.8s linear infinite}
@keyframes brilho{0%{left:-90px}55%,100%{left:120%}}
@media (prefers-reduced-motion: reduce){ .btn::after{display:none} }
.btn.fantasma{background:transparent;border:1px solid var(--line);color:var(--txt2);
  box-shadow:none;font-weight:500;font-size:14px;padding:14px}
.btn.fantasma::after{display:none}

/* ---------- video ---------- */
/* O player do YouTube sempre entrega 16:9, e um video vertical dentro dele
   vem com tarja preta dos dois lados, o que faz parecer quadrado. A saida e
   ampliar o iframe ate o video ocupar a largura inteira da caixa 9:16 e
   cortar o que sobra. Com altura 100% e proporcao 16/9, o video vertical
   dentro dele mede exatamente a largura da caixa. */
/* a tela de video inteira centralizada: o player no meio com o texto
   encostado na esquerda ficava torto */
/* A tela de video ocupa a altura util e nada mais: o player pega o que sobra
   entre o texto e o botao fixo. svh e a altura com as barras do navegador
   VISIVEIS, que e o pior caso: com vh o botao ficava atras da barra do
   Safari, que foi o que o Carlos viu no iPhone. */
.tela-video{display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:12px;width:100%}
.tela-video h2{max-width:22ch}
.tela-video .peq{max-width:34ch}
/* O palco dos videos NAO mora dentro do #tela: o #tela tem o innerHTML
   trocado a cada passo, e isso destruiria o iframe. Iframe destruido e
   iframe que carrega tudo de novo na proxima vez, que era o travamento no
   celular. Aqui os players nascem uma vez e ficam vivos ate o fim do quiz.
   Mover um iframe de lugar no DOM tambem forca recarga, entao ele nunca
   muda de pai: so aparece e some. */
#videos{flex:1;min-height:0;display:flex;justify-content:center;
  align-items:center;width:100%}
/* na tela de video a coluna toda vira flex, pra sobra de altura cair no
   palco em vez de virar espaco morto embaixo do texto */
body.tela-de-video .wrap{height:calc(100svh - 48px);display:flex;
  flex-direction:column;gap:14px}
body.tela-de-video #tela{flex:0 0 auto}
.player{position:relative;
  height:100%;width:auto;max-width:100%;
  aspect-ratio:9/16;
  border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;
  display:none}
.player.on{display:block}
.player iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  height:100%;width:auto;aspect-ratio:16/9;border:0;
  /* nada de clique chegando no player: e o que faz aparecer titulo,
     botao de compartilhar e o "assistir no YouTube" */
  pointer-events:none}
/* modo manual (16/10): quando o video nao comeca com som pelo nosso botao
   (iPhone), o player do YouTube aparece com o play dele e aceita o toque */
.player.manual iframe{pointer-events:auto}
/* a faixa cobre o player inteiro: o toque vale em qualquer lugar, nao so
   no risco amarelo do pe */
/* fim do video: o player escurece e o Continuar pisca, pra ficar obvio que
   o proximo passo e avancar */
.vbar{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:3;background:rgba(255,255,255,.14);
  opacity:0;transition:opacity .4s}
.vbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel2),var(--yel));
  transition:width .5s linear}
.player.meio .vbar{opacity:1}
.rever{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:none;
  border:0;border-radius:99px;padding:13px 22px;font-family:var(--fd);font-weight:800;font-size:15px;
  background:var(--yel);color:var(--on-yel);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.player.fim .rever{display:block}
.player.fim::after{content:"";position:absolute;inset:0;z-index:1;
  background:rgba(10,15,10,.72);transition:background .5s ease}
.btn.pisca{animation:piscaBtn 1.15s ease-in-out infinite}
/* pulsa so o brilho, sem escalar: o botao que cresce e encolhe mexe o alvo
   do toque bem na hora em que a pessoa vai tocar nele */
@keyframes piscaBtn{
  0%,100%{box-shadow:0 12px 30px rgba(255,180,0,.26)}
  50%{box-shadow:0 0 0 7px rgba(255,210,0,.22),0 14px 34px rgba(255,180,0,.45)}}
@media (prefers-reduced-motion: reduce){ .btn.pisca{animation:none;
  box-shadow:0 0 0 7px rgba(255,210,0,.22),0 14px 34px rgba(255,180,0,.45)} }

.som-on{position:absolute;inset:0;z-index:2;border:0;padding:0;cursor:pointer;
  background:transparent;display:flex;align-items:flex-end;justify-content:stretch}
.som-on .faixa{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 8px;color:var(--on-yel);white-space:nowrap;
  font-family:var(--fd);font-size:clamp(11.5px,3.2vw,14px);font-weight:600;
  background:linear-gradient(0deg,rgba(255,210,0,.97),rgba(255,168,0,.88));
  animation:pulsaSom 2.2s ease-in-out infinite}
.som-on .ic{font-size:15px;line-height:1}
@keyframes pulsaSom{0%,100%{opacity:1}50%{opacity:.78}}
@media (prefers-reduced-motion: reduce){ .som-on{animation:none} }

/* ---------- insercao ---------- */
.insercao{background:linear-gradient(160deg,#1E1A0A,var(--card) 58%);
  border:1.5px solid rgba(255,210,0,.42);border-radius:var(--r);padding:18px 16px;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.insercao::before{content:"";position:absolute;inset:-46% -12% auto auto;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,210,0,.2),transparent 70%)}
.insercao > *{position:relative}
.insercao .dado{font-family:var(--fd);font-size:38px;font-weight:800;color:var(--yel);
  letter-spacing:-.04em;line-height:1}
.insercao .fonte{font-size:11.5px;color:var(--txt3)}
/* 16/10: o +61% em figura, duas barras que sobem */
.mg{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:6px 0 2px}
.mg-col{display:flex;flex-direction:column;align-items:center;width:124px;gap:8px}
.mg-col small{text-align:center;line-height:1.3}
/* a area da barra tem altura fixa: a altura em % e sempre a proporcao certa */
.mg-area{height:140px;width:100%;display:flex;align-items:flex-end}
.mg-col small{font-size:12px;color:var(--txt3);font-family:var(--fd);font-weight:600}
.mg-bar{width:100%;height:0;border-radius:12px 12px 6px 6px;display:flex;align-items:flex-start;
  justify-content:center;padding-top:8px;transition:height 1s cubic-bezier(.22,1,.36,1);overflow:hidden}
.mg-bar.de{background:linear-gradient(180deg,#3A4A3D,#243026)}
.mg-bar.hoje{background:linear-gradient(180deg,#FF6B5A,#B4453A);box-shadow:0 0 26px rgba(255,107,90,.28)}
.mg-bar span{font-family:var(--fd);font-weight:800;font-size:13px;color:var(--txt2);opacity:0;transition:opacity .4s .7s}
.mg-bar.hoje span{font-size:18px;color:#fff}
.mg-bar.on span{opacity:1}
.mg-seta{align-self:center;width:54px;height:54px;color:var(--red);margin-bottom:40px;
  filter:drop-shadow(0 0 10px rgba(255,107,90,.45));animation:setaSobe 1.6s ease-in-out infinite}
@keyframes setaSobe{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-6px)}}
.mg-leg{text-align:center;font-size:11.5px;color:var(--txt3);margin:0}
@media (prefers-reduced-motion: reduce){ .mg-bar{transition:none} .mg-bar span{transition:none} .mg-seta{animation:none} }

/* ---------- loading ---------- */
.orbita{width:min(62vw,210px);margin:6px auto 0;display:block}
.orbita .arco{transform-origin:106px 106px;animation:gira 1.5s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.orbita .meio{font-family:var(--fd);font-weight:800;font-size:30px;fill:var(--yel)}
@media (prefers-reduced-motion: reduce){ .orbita .arco{animation:none} }
.load-bar{height:9px;border-radius:99px;background:#101A12;border:1px solid var(--line);
  overflow:hidden;margin:6px 0 4px}
.load-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--yel2),var(--yel));transition:width .4s linear}
.load-txt{text-align:center;font-size:14px;color:var(--txt2);min-height:21px}

/* ---------- resultado ---------- */
.circs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:2px}
.circ{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 10px;text-align:center}
.circ svg{width:92px;height:92px;margin:0 auto;display:block;transform:rotate(-90deg)}
.circ .anel{stroke:#1B2A1E;fill:none;stroke-width:9}
.circ .val{stroke:url(#gy);fill:none;stroke-width:9;stroke-linecap:round;
  stroke-dasharray:251;stroke-dashoffset:251;
  transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)}
.circ .n{position:relative;margin-top:-58px;font-family:var(--fd);font-size:22px;
  font-weight:800;color:var(--yel);font-variant-numeric:tabular-nums}
.circ p{font-size:12.5px;color:var(--txt2);margin-top:36px;line-height:1.35}
.diag{display:flex;flex-direction:column;gap:12px}
.d-top{position:relative;overflow:hidden;border-radius:18px;padding:18px 16px 16px;
  border:1.5px solid rgba(255,107,90,.6);background:linear-gradient(160deg,rgba(255,107,90,.12),var(--card) 62%)}
.d-top.n1{border-color:rgba(255,210,0,.6);background:linear-gradient(160deg,rgba(255,210,0,.10),var(--card) 62%)}
.d-top.n2{border-color:rgba(95,207,138,.55);background:linear-gradient(160deg,rgba(95,207,138,.10),var(--card) 62%)}
.d-top{--pulso:255,107,90}
.d-top.n1{--pulso:255,210,0} .d-top.n2{--pulso:95,207,138}
.d-top.on{animation:dPulsa 2.2s ease-in-out infinite}
@keyframes dPulsa{0%,100%{box-shadow:0 0 0 0 rgba(var(--pulso),0)}
  50%{box-shadow:0 0 0 6px rgba(var(--pulso),.10),0 0 32px rgba(var(--pulso),.22)}}
.d-tag{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FF8A78}
.d-top.n1 .d-tag{color:var(--yel)} .d-top.n2 .d-tag{color:var(--grn)}
.d-linha{display:flex;align-items:center;gap:9px}
.d-top .d-linha{margin-top:10px}
.d-emo{font-size:22px;line-height:1}
.d-nome{flex:1;min-width:0}
.d-top .d-nome{font-family:var(--fd);font-size:20px;font-weight:700;line-height:1.15}
.d-top .d-pct{font-family:var(--fd);font-size:42px;font-weight:800;color:#FF8A78;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.d-top.n1 .d-pct{color:var(--yel)} .d-top.n2 .d-pct{color:var(--grn)}
.d-barra{height:10px;border-radius:99px;background:#1B2A1E;overflow:hidden;margin-top:12px}
.d-barra i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#B4453A,#FF6B5A);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.n1 .d-barra i{background:linear-gradient(90deg,var(--yel2),var(--yel))}
.n2 .d-barra i{background:linear-gradient(90deg,#2E8B57,#5FCF8A)}
.d-frase{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--txt2)}
.d-frase b{color:var(--txt)}
.d-outros{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:15px 14px}
.d-it .d-nome{font-size:14.5px;font-weight:600;color:var(--txt)}
.d-it b{font-family:var(--fd);font-size:17px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.d-it.n0 b{color:#FF8A78} .d-it.n1 b{color:var(--yel)} .d-it.n2 b{color:var(--grn)}
.d-it .d-barra{height:7px;margin-top:8px}
.chip{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;white-space:nowrap}
.n0 .chip{background:rgba(255,107,90,.16);color:#FF8A78}
.n1 .chip{background:rgba(255,210,0,.14);color:var(--yel)}
.n2 .chip{background:rgba(95,207,138,.15);color:var(--grn)}
.d-curta{margin:6px 0 0;font-size:13px;color:var(--txt3)}
.d-nota{font-size:11.5px;color:var(--txt3);text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){ .d-top.on{animation:none} .d-barra i{transition:none} }
.nivel{border-left:3px solid var(--yel);border-radius:0 14px 14px 0;
  background:linear-gradient(100deg,var(--yel-soft),transparent);
  padding:15px 16px;font-size:15px;font-weight:700;color:var(--txt)}

/* ---------- listas ---------- */
.lista{display:flex;flex-direction:column;gap:0;padding:0;margin:0}
.lista li{list-style:none;display:flex;gap:11px;align-items:flex-start;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--txt2)}
.lista li:last-child{border:0;padding-bottom:0}
.lista li i{font-style:normal;flex:0 0 auto;width:23px;height:23px;border-radius:50%;
  background:rgba(95,207,138,.15);color:var(--grn);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800}
.lista.dor li i{background:rgba(255,107,90,.14);color:var(--red)}
.caixa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:10px}
.ab{display:grid;gap:11px}
.ab .lb{border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--card)}
.ab .lb.ruim{border-color:rgba(255,107,90,.3);background:linear-gradient(160deg,rgba(255,107,90,.06),var(--card))}
.ab .lb.bom{border-color:rgba(95,207,138,.34);background:linear-gradient(160deg,rgba(95,207,138,.06),var(--card))}
.ab h4{font-family:var(--fd);font-size:12px;letter-spacing:.11em;text-transform:uppercase;margin-bottom:11px}
.ab .ruim h4{color:var(--red)} .ab .bom h4{color:var(--grn)}

/* ---------- formulario ---------- */
.campo{margin-top:13px}
.campo label{display:block;font-family:var(--fd);font-size:11.5px;font-weight:600;
  letter-spacing:.1em;color:var(--txt2);margin-bottom:7px;text-transform:uppercase}
.campo input{width:100%;padding:17px 15px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);font-size:16px;transition:.2s}
.campo input:focus{outline:0;border-color:var(--yel);background:var(--card2);
  box-shadow:0 0 0 4px rgba(255,210,0,.12)}
.campo.erro input{border-color:var(--red)}
.campo .msg{color:var(--red);font-size:12px;margin-top:6px;display:none}
.campo.erro .msg{display:block}
.cadeado{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:13px;
  border-radius:14px;background:#101A12;border:1px dashed var(--line2);
  color:var(--txt2);font-size:12.5px}
.cadeado b{color:var(--yel)}
.privacidade{color:var(--txt3);font-size:11.5px;margin-top:12px;text-align:center}

/* ---------- funil e 9 pilares ---------- */
.funil{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.funil svg{width:100%;height:auto;display:block}
.etapa{display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  transition:border-color .3s,background .3s,transform .3s}
.etapa.on{border-color:rgba(255,210,0,.55);background:var(--card2)}
.etapa .marca{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:6px;
  background:var(--line2);transition:background .3s,box-shadow .3s}
.etapa.on .marca{background:var(--yel);box-shadow:0 0 0 4px rgba(255,210,0,.16)}
.etapa b{display:block;font-family:var(--fd);font-size:15px;font-weight:600;letter-spacing:-.02em}
.etapa i{display:block;font-style:normal;color:var(--yel);font-size:12.5px;font-weight:700;margin:3px 0 4px}
.etapa span{color:var(--txt2);font-size:13.5px;line-height:1.5}
.pil-i{display:flex;gap:13px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  opacity:0;transform:translateY(16px);
  transition:opacity .5s ease,transform .5s cubic-bezier(.16,1,.3,1),border-color .3s}
.pil-i.vis{opacity:1;transform:none}
.pil-i.on{border-color:rgba(255,210,0,.5)}
.pil-n{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--fd);font-weight:800;font-size:14px;color:var(--on-yel);
  background:linear-gradient(180deg,var(--yel),var(--yel2));
  font-variant-numeric:tabular-nums;transition:transform .3s}
.pil-i.on .pil-n{transform:scale(1.12)}
.pil-tx b{display:block;font-family:var(--fd);font-size:15px;font-weight:600;
  letter-spacing:-.02em;margin-bottom:3px}
.pil-tx i{display:block;font-style:normal;color:var(--yel);font-size:12.5px;font-weight:700;margin-bottom:6px}
.pil-tx span{color:var(--txt2);font-size:13.5px;line-height:1.5}
@media (prefers-reduced-motion: reduce){
  .pil-i{opacity:1;transform:none;transition:none}
  .etapa,.etapa .marca,.pil-n{transition:none}
}

/* ---------- o jogo dos presentes ---------- */
/* o cofre nao e mais uma barra propria: e um grupo na direita do topo.
   Sem sticky nem fundo, porque quem e sticky agora e o #topo inteiro. */
#cofre{display:flex;align-items:center;gap:7px;min-width:0;margin-left:auto;
  padding-left:9px;border-left:1px solid var(--line)}
/* o rotulo e a primeira coisa a ceder se a tela for estreita demais */
.gt-lb{font-family:var(--fd);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txt3);white-space:nowrap;
  overflow:hidden;text-overflow:clip;min-width:0}
.gt-slots{display:flex;gap:4px;flex:0 0 auto}
.gt-s{width:18px;height:18px;border-radius:6px;border:1px dashed var(--line2);
  display:grid;place-items:center;font-size:9.5px;color:var(--txt3);
  transition:transform .3s,background .3s,border-color .3s}
.gt-s.on{border:1px solid var(--yel);border-style:solid;color:var(--on-yel);
  background:linear-gradient(180deg,var(--yel),var(--yel2))}
.gt-s.pop{animation:pop .5s cubic-bezier(.16,1,.3,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.gt-n{font-family:var(--fd);font-size:11px;color:var(--yel);font-variant-numeric:tabular-nums;flex:0 0 auto}
.gt-b{background:0;border:0;padding:4px;font-size:15px;cursor:pointer;flex:0 0 auto;line-height:1}

.caixa-p{width:min(64vw,210px);margin:4px auto 0;display:block;cursor:pointer;
  background:0;border:0;padding:0;animation:flutua 3.4s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.caixa-p.treme{animation:treme .5s ease-in-out}
@keyframes treme{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}
  60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.caixa-p svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 34px rgba(255,180,0,.3))}
.toque{text-align:center;font-family:var(--fd);font-size:14px;letter-spacing:.14em;font-weight:700;
  text-transform:uppercase;color:var(--yel);animation:pisca 1.6s infinite}
.p-card{background:linear-gradient(160deg,#1E1A0A,var(--card) 56%);
  border:1.5px solid rgba(255,210,0,.5);border-radius:var(--r);padding:18px 16px;
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
  animation:sobe .5s cubic-bezier(.16,1,.3,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.p-card::before{content:"";position:absolute;inset:-40% -10% auto auto;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,210,0,.24),transparent 70%)}
.p-card > *{position:relative}
.p-card .ico{font-size:34px;line-height:1}
.p-card .porque{margin:0;color:var(--txt);font-size:14.5px;line-height:1.45;border-left:3px solid var(--yel);padding-left:10px}
.p-card .val{font-family:var(--fd);font-size:26px;font-weight:800;color:var(--yel);letter-spacing:-.03em}
.p-card .val s{color:var(--txt3);font-size:15px;font-weight:500;margin-right:8px}
.p-guardado{display:flex;gap:9px;align-items:flex-start;padding:12px;border-radius:12px;
  background:#101A12;border:1px dashed var(--line2);color:var(--txt2);font-size:12.5px}
.p-guardado b{color:var(--yel)}
#confete{position:fixed;inset:0;pointer-events:none;z-index:45}

#modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,5,.82);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .25s}
#modal.on{opacity:1;pointer-events:auto}
#modal .cx{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);
  padding:20px 18px;max-width:420px;width:100%;max-height:82vh;overflow:auto;
  display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion: reduce){
  .caixa-p,.toque,.gt-s.pop,.p-card{animation:none}
}

.timer{display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(100deg,rgba(255,210,0,.14),transparent);
  border:1px solid rgba(255,210,0,.42);border-radius:14px;padding:12px 14px}
.timer .lb{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--txt2)}
.timer .rl{font-family:var(--fd);font-size:26px;font-weight:800;color:var(--yel);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.off{display:inline-flex;align-self:center;align-items:center;gap:6px;
  background:linear-gradient(100deg,var(--yel),var(--yel2));color:var(--on-yel);
  border-radius:99px;padding:5px 13px;font-family:var(--fd);font-size:12px;
  font-weight:800;letter-spacing:.04em}

.roda{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--card);transition:transform .25s,border-color .25s}
.roda:hover{transform:translateY(-4px);border-color:rgba(255,210,0,.5)}
.roda svg{width:100%;height:auto;display:block;background:#0D140E}
.roda-pe{padding:15px}
.roda-pe b{display:block;font-family:var(--fd);font-size:15.5px;font-weight:600;
  letter-spacing:-.02em;margin-bottom:4px}
.roda-pe span{color:var(--txt2);font-size:13.5px}
/* a linha amarela corre a roda inteira: o arco e um traco de 330 num
   perimetro de 716, entao girando o grupo ele passa por todos os nove */
.orbita-pil{transform-origin:170px 158px;animation:giraPil 9s linear infinite}
@keyframes giraPil{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .orbita-pil{animation:none} }

/* ---------- pagina final: o ritmo da referencia ---------- */
.sec{padding-block:26px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(18px);
  transition:opacity .55s ease,transform .55s cubic-bezier(.16,1,.3,1)}
.sec.in{opacity:1;transform:none}
.sec:last-of-type{border-bottom:0}
.sec.meio{text-align:center;align-items:center}
.kick{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--yel)}
.sh{font-family:var(--fd);font-weight:600;letter-spacing:-.03em;line-height:1.15;
  font-size:clamp(20px,5.4vw,28px)}
.sp{color:var(--txt2);font-size:15px}
.legal{padding-top:22px;color:var(--txt3);font-size:11.5px;text-align:center;
  display:flex;flex-direction:column;gap:6px}

/* comparativo em barras que contam de zero */
/* comparativo linha a linha: de um lado a landing de sempre, do outro o
   funil de quiz. Duas colunas com uma barra so nao comparava nada. */
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp-l{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.cmp-l > .t{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--yel)}
.cmp-base{font-size:11.5px;color:var(--txt3);margin-top:-4px}
.cmp-b{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:9px}
.cmp-r{font-family:var(--fd);font-size:11px;font-weight:600;color:var(--txt3)}
.cmp-t{height:9px;border-radius:99px;background:#101A12;
  border:1px solid var(--line);overflow:hidden;display:block}
/* a barra cresce do zero quando o bloco entra na tela, e o numero sobe
   junto: parada no valor final ela nao diz nada */
.cmp-t i{display:block;height:100%;width:0;border-radius:99px;
  transition:width 1.15s cubic-bezier(.22,1,.36,1)}
/* a menor barra do bloco tem 4%: sem um minimo ela vira um pontinho e
   parece defeito, nao numero baixo */
.cmp-t i[data-pct]{min-width:0}
.cmp-b .cmp-t i:not([style*="width: 0"]){min-width:14px}
.cmp-b.hoje .cmp-t i{background:linear-gradient(90deg,#8E3A31,#B4453A)}
.cmp-b.quiz .cmp-t i{background:linear-gradient(90deg,var(--yel2),var(--yel))}
.cmp-v{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.cmp-v b{font-family:var(--fd);font-size:13.5px;font-variant-numeric:tabular-nums}
.cmp-b.hoje .cmp-v b{color:#D0695E}
.cmp-b.quiz .cmp-v b{color:var(--yel)}
.cmp-v span{font-size:10px;color:var(--txt3)}
@media(max-width:359px){ .cmp-b{grid-template-columns:80px 1fr 54px;gap:7px} }
.lado b{font-family:var(--fd);font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase}
.lado.hoje b{color:var(--red)} .lado.quiz b{color:var(--yel)}
.lado span{font-size:13.5px;color:var(--txt2);line-height:1.5}
.lado.quiz span{color:var(--txt)}

/* grafico de projecao */
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}

/* antes x depois com a seta no meio */
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}
.ba-c{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:15px 12px;
  display:flex;flex-direction:column;gap:8px;text-align:center;min-width:0}
.ba-c.ruim{border-color:rgba(255,107,90,.34);background:linear-gradient(160deg,rgba(255,107,90,.07),var(--card))}
.ba-c.bom{border-color:rgba(255,210,0,.45);background:linear-gradient(160deg,rgba(255,210,0,.09),var(--card))}
.ba-c .ico{font-size:30px;line-height:1}
.ba-c .lb{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.ba-c.ruim .lb{color:var(--red)} .ba-c.bom .lb{color:var(--yel)}
.ba-c small{color:var(--txt2);font-size:12.5px;line-height:1.4}
.ba-seta{color:var(--yel);font-size:22px;font-family:var(--fd)}

/* capacidades */
.checks{display:flex;flex-direction:column;gap:0;margin:0;padding:0}
.checks li{list-style:none;display:flex;gap:11px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--txt2)}
.checks li:last-child{border:0}
.checks li i{font-style:normal;flex:0 0 auto;width:24px;height:24px;border-radius:50%;
  background:rgba(255,210,0,.16);color:var(--yel);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800}

/* stack com valor somado */
.stack{display:flex;flex-direction:column;gap:9px}
.st-i{display:flex;gap:12px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px}
.st-i.principal{border-color:rgba(255,210,0,.5);
  background:linear-gradient(160deg,rgba(255,210,0,.09),var(--card) 60%)}
.st-i .ico{font-size:24px;line-height:1;flex:0 0 auto}
.st-i .tx{flex:1;min-width:0}
.st-i .tx b{display:block;font-family:var(--fd);font-size:14.5px;font-weight:600}
.st-i .tx span{font-size:13px;color:var(--txt2);line-height:1.45}
.st-i .pr{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;gap:2px}
.st-i .pr s{color:var(--txt3);font-size:12.5px}
.st-i .pr em{font-style:normal;font-family:var(--fd);font-size:10px;font-weight:600;
  letter-spacing:.1em;color:var(--yel)}
.total{margin-top:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.total .t1{color:var(--txt2);font-size:13.5px}
.total .t2{font-family:var(--fd);font-size:30px;font-weight:800;color:var(--txt);

<script>
(function(){
"use strict";
var CFG = window.CFG || {};
var ok = function(v){ return v && v !== 'TODO'; };

/* =====================================================================
   1. ESTADO, UTM E RASTREAMENTO
   ===================================================================== */
var state = { idx:0, flow:[], resp:{}, multi:{}, progMax:0, nome:'', email:'', whats:'', score:null };

function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
var SESSION = (function(){
  try { var s = sessionStorage.getItem('qq_sid'); if (!s) { s = uid(); sessionStorage.setItem('qq_sid', s); } return s; }
  catch(e){ return uid(); }
})();

var UTM = (function(){
  var out = {};
  try {
    var p = new URLSearchParams(location.search);
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'].forEach(function(k){
      var v = p.get(k); if (v) out[k] = v;
    });
    var guardado = localStorage.getItem('qq_utm');
    if (!Object.keys(out).length && guardado) out = JSON.parse(guardado);
    else if (Object.keys(out).length) localStorage.setItem('qq_utm', JSON.stringify(out));
  } catch(e){}
  return out;
})();

/* o _fbc do Pixel: quando nao existe cookie, monta a partir do fbclid da URL */
function fbc(){
  try {
    var m = document.cookie.match(/_fbc=([^;]+)/);
    if (m) return m[1];
    if (UTM.fbclid) return 'fb.1.' + Date.now() + '.' + UTM.fbclid;
  } catch(e){}
  return '';
}

if (ok(CFG.META_PIXEL_ID)) {
  (function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)})
  (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  /* 16/10: sem a configuracao automatica da Meta. Ligada, ela transforma cada
     toque em botao em evento (SubscribedButtonClick, 43 num percurso) e pode
     "adivinhar" Lead pelo texto do botao. Os eventos do funil sao so os nossos. */
  window.fbq('set', 'autoConfig', false, CFG.META_PIXEL_ID);
  window.fbq('init', CFG.META_PIXEL_ID);
}

/* os unicos eventos que chegam ao Pixel (o resto fica so na analise interna) */
var PIXEL_EVENTOS = { PageView:1, QuizStart:1, ViewContent:1, Lead:1, InitiateCheckout:1, Purchase:1,
  /* 16/10, bifurcação: escolheu a implementação e marcou a call */
  EscolheuImplementacao:1, Schedule:1 };

/* Um event_id por evento, o MESMO no navegador e no servidor. E ele que
   permite a Meta deduplicar Pixel e CAPI em vez de contar duas vezes. */
function track(evento, dados){
  var d = dados || {};
  var eid = uid();
  var corpo = {
    event: evento, event_id: eid, variant: CFG.VARIANT, session: SESSION,
    ts: new Date().toISOString(), url: location.href,
    utm: UTM, fbc: fbc(), dados: d
  };
  if (CFG.DEBUG) try { console.log('[track]', evento, corpo); } catch(e){}
  /* 16/10: para o Pixel vao so os eventos do funil, e cada um uma vez. Antes
     cada resposta, video e presente virava evento (cerca de 30 por pessoa), o
     PageView ia como evento personalizado e o Lead levava nome, e-mail,
     WhatsApp e as respostas em texto aberto. Dado pessoal so vai pela
     correspondencia avancada (fbq init com em/ph), que o Pixel criptografa. */
  if (window.fbq && ok(CFG.META_PIXEL_ID) && PIXEL_EVENTOS[evento]) {
    var padrao = { PageView:1, Lead:1, Purchase:1, InitiateCheckout:1, ViewContent:1, CompleteRegistration:1, Schedule:1 };
    var seguro = {};
    ['nivel','segmento','tela','tipo','versao'].forEach(function(k){ if (d[k] !== undefined) seguro[k] = d[k]; });
    if (evento === 'Lead' || evento === 'InitiateCheckout' || evento === 'ViewContent') {
      seguro.content_name = 'Revolução do Quiz';
      seguro.currency = 'BRL';
      seguro.value = CFG.PRECO_NUM;
    }
    try {
      if (evento === 'PageView') window.fbq('track', 'PageView', {}, { eventID: eid });
      else window.fbq(padrao[evento] ? 'track' : 'trackCustom', evento, seguro, { eventID: eid });
    } catch(e){}
  }
  [CFG.N8N_WEBHOOK_URL, CFG.ANALYTICS_URL].forEach(function(url){
    if (!ok(url)) return;
    try {
      var s = JSON.stringify(corpo);
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([s], {type:'application/json'}));
      else fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:s, keepalive:true });
    } catch(e){}
  });
}

/* =====================================================================
   2. AREAS E PERGUNTAS
   ===================================================================== */
var AREAS = {
  trafego:     { nome:'Custo da captação',      emoji:'💸', questions:[6,7,8] },
  mesa:        { nome:'Cliente deixado na mesa', emoji:'🪑', questions:[9,10,22] },
  qualificacao:{ nome:'Qualificação do lead',    emoji:'🔍', questions:[12,14,16,17,18] },
  execucao:    { nome:'Execução',                emoji:'🧩', questions:[13,15,19,20,21,23] }
};
var AREA_KEYS = ['trafego','mesa','qualificacao','execucao'];

/* perguntas em que a PRIMEIRA opcao e a resposta saudavel, nao a grave */
var INVERTED = new Set([7,15,16,20,21,22]);
/* perguntas de multipla escolha: pontuam pela quantidade marcada */
var MULTI = new Set([9,19]);

var AREA_LABELS = {
  trafego:     [[70,'Cada lead sai caro'], [40,'Pesado'],        [0,'Sob controle']],
  mesa:        [[70,'Muito'],             [40,'Bastante'],      [0,'Pouco']],
  qualificacao:[[70,'Lead cru'],          [40,'Irregular'],      [0,'Filtrado']],
  execucao:    [[70,'Travado'],           [40,'Começa e para'],  [0,'Anda']]
};
/* 16/10: o diagnostico em linguagem simples. Tres faixas: 70 ou mais e
   critico, 40 a 69 e atencao, abaixo disso esta sob controle. */
var NIVEL_DIAG = ['Crítico', 'Atenção', 'Sob controle'];
function nivelDiag(v){ return v >= 70 ? 0 : (v >= 40 ? 1 : 2); }
var DIAG_FRASE = {
  trafego:      ['Cada lead está saindo caro',     'O custo pesa na conta',          'O custo está sob controle'],
  mesa:         ['Muita gente boa está escapando', 'Parte dos bons clientes escapa', 'Pouca gente boa escapa'],
  qualificacao: ['O lead chega sem estar pronto',  'A qualidade do lead varia',      'O lead chega filtrado'],
  execucao:     ['A estrutura não sai do papel',   'A execução ainda trava',         'A execução anda']
};
var DIAG_SIGNIFICA = {
  trafego:      'Você paga por cada clique, e o contato chega sem dizer quem é. Por isso cada venda sai mais cara.',
  mesa:         'Tem gente pronta para comprar passando pelo seu funil sem ser vista.',
  qualificacao: 'Os contatos chegam sem filtro, e o seu tempo vai para quem ainda não está pronto.',
  execucao:     'Você sabe o que precisa fazer, mas a estrutura não sai do papel.'
};
function areaLabel(k, pct){
  var t = AREA_LABELS[k] || [[0,'']];
  for (var i=0;i<t.length;i++) if (pct >= t[i][0]) return t[i][1];
  return t[t.length-1][1];

/* Som sintetizado no proprio navegador: zero arquivo, zero peso.
   O navegador so libera audio depois de um toque, entao ensure() roda no
   primeiro clique e de novo no clique da caixa. */
var SFX = (function(){
  var ctx = null, ligado = true;
  try { ligado = localStorage.getItem('qq_som') !== '0'; } catch(e){}
  function ensure(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ctx = null; }
    return ctx;
  }
  function ruido(dur, vol, filtro){
    var c = ensure(); if (!c || !ligado) return;
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = filtro; bp.Q.value = .9;
    var g = c.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
  }
  function tom(freq, t0, dur, vol){
    var c = ensure(); if (!c || !ligado) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .02);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  }
  return {
    ensure: ensure,
    ligado: function(){ return ligado; },
    alterna: function(){
      ligado = !ligado;
      try { localStorage.setItem('qq_som', ligado ? '1' : '0'); } catch(e){}
      return ligado;
    },
    toque: function(){ tom(880, 0, .1, .08); },
    /* palmas: varias rajadas curtas de ruido, que e como plateia soa */
    palmas: function(){
      for (var i = 0; i < 22; i++) {
        (function(k){ setTimeout(function(){ ruido(.09, .05 + Math.random() * .04, 1400 + Math.random() * 1800); },
          k * 26 + Math.random() * 30); })(i);
      }
    },
    fanfarra: function(){ [523,659,784,1046].forEach(function(fq, i){ tom(fq, i * .1, .26, .09); }); }
  };
})();

/* confete em canvas: mais leve que dezenas de elementos no DOM */
function confete(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('confete'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  var cores = ['#FFD200','#FFA800','#F2F0E6','#5FCF8A'];
  var ps = [];
  for (var i = 0; i < 110; i++) ps.push({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2.4 + Math.random() * 3.2, vx: -1.4 + Math.random() * 2.8,
    r: Math.random() * Math.PI, vr: -.14 + Math.random() * .28,
    c: cores[(Math.random() * cores.length) | 0]
  });
  var t0 = performance.now();
  (function quadro(t){
    var dt = t - t0;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - dt / 2600);
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    });
    if (dt < 2600) requestAnimationFrame(quadro);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

/* =====================================================================
   4. SCORING
   ===================================================================== */
var Q_MAP = {}; Q.forEach(function(q){ Q_MAP[q.n] = q; });

function optScore(n, idx){
  var q = Q_MAP[n];
  if (MULTI.has(n)) {
    var marcadas = (state.multi['P'+n] || []);
    var nenhuma = q.opts.length - 1;
    if (marcadas.indexOf(nenhuma) > -1 || !marcadas.length) return 1;
    return Math.max(1, Math.min(4, marcadas.length));
  }
  if (typeof idx !== 'number') return 1;
  var n_opts = q ? q.opts.length : 4;
  /* normaliza para 1 a 4 mesmo quando a pergunta tem 3 ou 5 opcoes */
  var bruto = INVERTED.has(n) ? idx : (n_opts - 1 - idx);
  return 1 + (bruto / Math.max(1, n_opts - 1)) * 3;
}

function computeScores(){
  var soma = {}, max = {}, total = 0, totalMax = 0;
  AREA_KEYS.forEach(function(k){
    soma[k] = 0; max[k] = AREAS[k].questions.length * 4;
    AREAS[k].questions.forEach(function(n){ soma[k] += optScore(n, state.resp['P'+n]); });
    total += soma[k]; totalMax += max[k];
  });
  var geral = Math.round((total / totalMax) * 100);
  var nivel = 'Leve';
  if (geral >= 75) nivel = 'Crítico';
  else if (geral >= 55) nivel = 'Alto';
  else if (geral >= 35) nivel = 'Moderado';

  var pct = {};
  AREA_KEYS.forEach(function(k){ pct[k] = Math.round((soma[k] / max[k]) * 100); });

  /* nunca 100% e nunca empate: teto 96, piso 38, degrade por posicao */
  var rank = AREA_KEYS.slice().sort(function(a,b){
    return (pct[b] - pct[a]) || (AREA_KEYS.indexOf(a) - AREA_KEYS.indexOf(b));
  });
  var TETO = 96, PISO = 38;
  rank.forEach(function(k,i){ pct[k] = Math.max(PISO, Math.min(TETO, pct[k]) - i); });

  return { geral: Math.min(TETO, geral), nivel: nivel, pct: pct, rank: rank,
           top: rank[0], segundo: rank[1],
           segmento: nivel.toLowerCase() + '|' + rank[0] };
}

/* =====================================================================
   5. FLUXO: A FONTE DA VERDADE DA ORDEM
   ===================================================================== */
function buildFlow(){
  /* Na versao case a capa vira duas telas: a abertura (foto, promessa e um
     botao) e a pergunta de homem ou mulher logo depois. Vai contra a regra
     da casa de a capa ja ser a primeira pergunta, a pedido do Carlos, e e
     justamente o que essa versao separada permite medir. */
  var f = VERSAO === 'case' ? [{ kind:'abertura' }, { kind:'capa' }] : [{ kind:'capa' }];
  Q_DEMO.forEach(function(q){ f.push({ kind:'demo', q:q }); });
  f.push({ kind:'presente', g:0 });          /* nivel 1, depois do perfil: o Prompt */
  f.push({ kind:'video', k:'generico' });

  Q.forEach(function(q){
    f.push({ kind:'q', q:q });
    RESPIROS.forEach(function(r){ if (r.after === q.n) f.push({ kind:'respiro', r:r }); });
    if (q.n === 10) { f.push({ kind:'video', k:'dor' }); f.push({ kind:'presente', g:1 }); }
    if (q.n === 16) f.push({ kind:'video', k:'crencas' });
    if (q.n === 20) f.push({ kind:'video', k:'identidade' });
  });

  f.push({ kind:'loading', qual:'diagnostico' });
  f.push({ kind:'resultado' });
  f.push({ kind:'q', q:Q_COMPROMISSO, solto:true });
  f.push({ kind:'prova1' }); f.push({ kind:'prova2' }); f.push({ kind:'prova3' });
  f.push({ kind:'prova4' }); f.push({ kind:'prova5' });
  f.push({ kind:'q', q:Q_ULTIMA, solto:true });
  /* o ultimo presente vem logo antes do formulario de proposito: e ele que
     da o motivo pra pessoa preencher. "Agora eu preciso saber pra quem eu
     entrego tudo isso." */
  f.push({ kind:'presente', g:2 });
  f.push({ kind:'form' });
  f.push({ kind:'loading', qual:'plano' });
  /* bifurcacao: as telas existem no caminho de todos do braco case_bif, mas
     cada uma so e pisada quando o `se` dela vale (ver pulaVazio) */
  if (BIF) {
    /* aparece para o perfil de implementacao, e tambem para quem voltou das
       4 perguntas (chegou pelo link da oferta): ai ela e a saida para o metodo */
    f.push({ kind:'bifurcacao', se: function(){ return perfilImplementacao() || state.caminho === 'impl'; } });
    QI.forEach(function(q){ f.push({ kind:'q', q:q, se: function(){ return state.caminho === 'impl'; } }); });
    f.push({ kind:'implResultado', se: function(){ return state.caminho === 'impl'; } });
  }
  f.push({ kind:'oferta' });
  return f;
}

function updateProgress(){
  var p = state.flow[state.idx];
  var meta = state.flow.findIndex(function(x){ return x.kind === 'resultado'; });
  var pct;
  if (p.kind === 'capa' || p.kind === 'abertura') pct = 3;
  else if (meta > 0 && state.idx <= meta) pct = Math.round((state.idx / meta) * 100);
  else pct = 100;

  if (pct > state.progMax) state.progMax = pct;

/* uma insercao condicional so entra no caminho se a resposta que a justifica
   foi dada. A condicao nao pode morar no buildFlow, que roda antes de existir
   resposta: ela e avaliada aqui, na hora de pisar na tela. */
function pulaVazio(i, dir){
  var limite = 0;
  while (i > 0 && i < state.flow.length && limite++ < 30) {
    var p = state.flow[i];
    /* 16/10: vale para o respiro (p.r.se) e para as telas da bifurcacao (p.se) */
    var se = p.se || (p.kind === 'respiro' && p.r && p.r.se);
    if (!se || se()) break;
    i += dir;
  }
  return i;
}
function irPara(i, dir){
  var d = dir || (i >= state.idx ? 1 : -1);
  i = pulaVazio(Math.max(0, Math.min(state.flow.length - 1, i)), d);
  state.idx = Math.max(0, Math.min(state.flow.length - 1, i));
  render();
  try { window.scrollTo({ top:0, behavior:'instant' }); } catch(e){ window.scrollTo(0,0); }
}
function proximo(){ irPara(state.idx + 1, 1); }
function anterior(){ irPara(state.idx - 1, -1); }

function desenhaHorarios(caixa, dias, semAgenda, aviso){
  var dia = 0, escolhido = null;
  function pinta(){
    caixa.innerHTML =
      (aviso ? '<p class="peq aviso">' + esc(aviso) + '</p>' : '') +
      '<div class="dias">' + dias.map(function(d, i){
        return '<button type="button" class="dia' + (i === dia ? ' on' : '') + '" data-d="' + i + '">' + esc(d.rotulo) + '</button>';
      }).join('') + '</div>' +
      '<div class="horas">' + dias[dia].horarios.map(function(h){
        return '<button type="button" class="hora' + (escolhido === h.inicio ? ' on' : '') + '" data-h="' + esc(h.inicio) + '">' + esc(h.hora) + '</button>';
      }).join('') + '</div>' +
      '<button class="btn" id="confirma" type="button"' + (escolhido ? '' : ' disabled') + '>' +
        (escolhido ? 'Confirmar ' + esc(dias[dia].rotulo) + ' às ' + esc(horaDe(escolhido)) : 'Escolha um horário') + '</button>';
    [].forEach.call(caixa.querySelectorAll('.dia'), function(b){
      b.addEventListener('click', function(){ dia = +b.dataset.d; escolhido = null; pinta(); });
    });
    [].forEach.call(caixa.querySelectorAll('.hora'), function(b){
      b.addEventListener('click', function(){ escolhido = b.dataset.h; pinta(); });
    });
    document.getElementById('confirma').addEventListener('click', function(){ if (escolhido) marca(escolhido); });
  }
  function horaDe(inicio){
    var h = null;
    dias[dia].horarios.forEach(function(x){ if (x.inicio === inicio) h = x.hora; });
    return h || '';
  }
  function marca(inicio){
    var bt = document.getElementById('confirma');
    bt.disabled = true; bt.textContent = 'Marcando...';
    var corpo = {
      inicio: inicio, nome: state.nome, whatsapp: state.whats, email: state.email, versao: VERSAO,
      bid: BANDIT ? BANDIT.bid : '', exp: BANDIT ? BANDIT.exp : '', arm: BANDIT ? BANDIT.arm : '',
      respostas: { vende: implRotulo(0), faturamento: implRotulo(1), decide: implRotulo(2), comeca: implRotulo(3) },
      utm: UTM || {}
    };
    fetch(CFG.AGENDA_API + '/marcar', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(corpo) })
      .then(function(r){ return r.json().then(function(d){ return { st: r.status, d: d }; }); })
      .then(function(x){
        if (x.d && x.d.ok) return agendou(x.d);
        if (x.st === 409) {
          /* alguem pegou o horario: recarrega os livres e avisa */
          return fetch(CFG.AGENDA_API + '/horarios', { cache:'no-store' }).then(function(r){ return r.json(); })
            .then(function(d){
              if (!d || !d.ok || !d.dias || !d.dias.length) return semAgenda();
              desenhaHorarios(caixa, d.dias, semAgenda, 'Esse horário acabou de ser ocupado. Escolha outro.');
            });
        }
        semAgenda();
      })
      .catch(semAgenda);
  }
  pinta();
}

function telaPergunta(p){

          '<span class="em">' + o[0] + '</span>' +

      }).join('') +
    '</div>' +
    (multi ? '<button class="btn" id="segue" type="button" disabled>Continuar</button>' : '');

  var segue = document.getElementById('segue');
  function atualizaSegue(){
    if (!segue) return;
    var n = (state.multi[chave] || []).length;
    segue.disabled = n === 0;
    segue.textContent = n === 0 ? 'Escolha pelo menos uma' : 'Continuar';
  }
  atualizaSegue();

  [].forEach.call(elTela.querySelectorAll('.opt'), function(b){
    b.addEventListener('click', function(){
      var i = +b.dataset.i;
      if (multi) {
        var lista = state.multi[chave] || [];
        var nenhuma = q.opts.length - 1;
        if (i === nenhuma) lista = (lista.indexOf(i) > -1) ? [] : [i];
        else {
          lista = lista.filter(function(x){ return x !== nenhuma; });
          var pos = lista.indexOf(i);
          if (pos > -1) lista.splice(pos, 1); else lista.push(i);
        }
        state.multi[chave] = lista;
        [].forEach.call(elTela.querySelectorAll('.opt'), function(x){
          x.classList.toggle('on', lista.indexOf(+x.dataset.i) > -1);
        });
        atualizaSegue();
        return;

      if (q.key) state.resp[q.key] = i;
      [].forEach.call(elTela.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      track('Resposta', { pergunta: q.n, opcao: i });
      setTimeout(proximo, 240);
    });
  });

  if (segue) segue.addEventListener('click', function(){
    track('Resposta', { pergunta: q.n, marcadas: state.multi[chave] });
    proximo();
  });
}

/* ---------- video ---------- */
/* O video comeca sozinho, mas MUDO. Nao existe navegador que deixe tocar com
   som sem um toque: o Chrome, o Safari e o Firefox bloqueiam todos, e o que
   acontece quando se tenta e o video nao tocar nada. Entao ele entra tocando
   mudo e uma faixa por cima convida a ligar o som. Um toque resolve, e o
   video continua de onde esta em vez de voltar ao comeco. */
/* =====================================================================
   OS PLAYERS, QUE NASCEM UMA VEZ SO

   Antes cada tela de video montava um <iframe> novo. O navegador tinha que
   subir o player inteiro do YouTube bem na hora da troca de tela, junto com
   a animacao de entrada, e no celular isso travava. Agora os quatro players
   sao criados em segundo plano enquanto a pessoa responde as perguntas, e a
   tela so acende o que precisa.

   Duas regras que mandam no desenho daqui:
   - iframe destruido perde tudo, entao nenhum player e removido do DOM;
   - iframe movido de pai tambem recarrega, entao nenhum player troca de
     lugar: o #videos e o pai de todos, do inicio ao fim.
   ===================================================================== */
var elVideos = document.getElementById('videos');
var ORDEM_VIDEOS = ['generico','dor','crencas','identidade'];
/* 16/10: a barrinha de progresso aparece da metade do video pra frente (o
   efeito que o video das crencas ja traz editado; nele a nossa fica de fora
   para nao aparecerem duas) */
var SEM_BARRA = { crencas: 1 };
var PLAYERS = {};
var videoAtivo = null;

/* controls=0 tira a barra, iv_load_policy=3 tira as anotacoes, rel=0 tira
   os relacionados do fim, fs=0 tira o botao de tela cheia e disablekb=1
   desliga o teclado. Com o iframe sem pointer-events, o titulo e o
   "assistir no YouTube" nem chegam a aparecer.
   autoplay=0 de proposito: o player sobe, mas nao gasta dado tocando um
   video que a pessoa ainda nao chegou a ver. Quem manda tocar e a tela. */
var PARAMS_VIDEO = 'mute=1&playsinline=1&controls=0&rel=0&modestbranding=1' +
                   '&iv_load_policy=3&fs=0&disablekb=1&enablejsapi=1&loop=0' +
                   '&cc_load_policy=0&cc_lang_pref=pt';

function mandaPra(pl, comando, args){
  if (!pl || !pl.iframe || !pl.iframe.contentWindow) return;
  try {
    pl.iframe.contentWindow.postMessage(JSON.stringify({
      event: 'command', func: comando, args: args || []
    }), '*');
  } catch(e){}
}

function criaPlayer(chave){
  if (PLAYERS[chave]) return PLAYERS[chave];
  var v = VIDEOS[chave];
  if (!v || !elVideos) return null;
  var caixa = document.createElement('div');
  caixa.className = 'player';
  caixa.innerHTML =
    '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(v.id) + '?' +
      PARAMS_VIDEO + '&autoplay=0" title="' + esc(v.titulo) + '" ' +
      'allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
      'allowfullscreen></iframe>' +
    '<div class="vbar"><i></i></div>' +
    '<button class="rever" type="button" aria-label="Ver de novo">&#8635; Ver de novo</button>' +
    '<button class="som-on" type="button" aria-label="Ligar o som">' +
      '<span class="faixa"><span class="ic">&#128263;</span>' +
      '<span>Toque para ouvir</span></span></button>';
  elVideos.appendChild(caixa);

  var pl = { chave:chave, v:v, caixa:caixa,
             iframe:caixa.querySelector('iframe'),
             barra:caixa.querySelector('.vbar i'), dur:0,
             som:caixa.querySelector('.som-on'),
             desmutou:false, terminou:false, hs:null, tSom:null };

  /* ate o toque o video corre mudo, entao a pessoa ja perdeu o comeco.
     Volta pro zero antes de ligar o som: ela ouve a fala inteira. */
  pl.som.addEventListener('click', function(){
    mandaPra(pl, 'seekTo', [0, true]);
    mandaPra(pl, 'unMute');
    mandaPra(pl, 'setVolume', [100]);
    mandaPra(pl, 'playVideo');
    pl.som.classList.add('hide');
    pl.caixa.classList.remove('fim');
    elBtnFixo.classList.remove('pisca');
    track('VideoSom', { id: pl.v.id });
    /* O unMute viaja por postMessage, e postMessage e um tiro no escuro: se
       o player ainda nao esta ouvindo, o comando se perde e o video segue
       mudo sem avisar ninguem. Se em 900ms ele nao confirmar que desmutou,
       o iframe e recarregado ja com som. O recarregamento acontece dentro
       do gesto da pessoa, que e o que o navegador exige pra tocar com som. */
    clearTimeout(pl.tSom);
    pl.tSom = setTimeout(function(){
      if (pl.desmutou || videoAtivo !== pl) return;
      pl.desmutou = true;
      pl.estado = undefined;
      pl.iframe.src = 'https://www.youtube-nocookie.com/embed/' + pl.v.id + '?' +
                      PARAMS_VIDEO.replace('mute=1', 'mute=0') + '&autoplay=1&start=0';
      escuta(pl);
      track('VideoSomRecarga', { id: pl.v.id });
    }, 900);
    clearTimeout(pl.tManual);
    pl.tManual = setTimeout(function(){
      /* tocando (1) ou carregando (3) e sinal de que o play foi aceito; parado,
         pausado ou sem resposta e que o iPhone recusou */
      if (videoAtivo === pl && pl.estado !== 1 && pl.estado !== 3) modoManual(pl);
    }, 3500);
  });

  /* o replay do proprio YouTube nao aceita toque (o iframe nao recebe
     clique): no fim do video aparece o nosso */
  caixa.querySelector('.rever').addEventListener('click', function(){
    pl.terminou = false;
    pl.caixa.classList.remove('fim', 'meio');
    if (pl.barra) pl.barra.style.width = '0';
    elBtnFixo.classList.remove('pisca');
    mandaPra(pl, 'seekTo', [0, true]);
    mandaPra(pl, 'playVideo');
    track('VideoRever', { id: pl.v.id });
  });

  PLAYERS[chave] = pl;
  return pl;
}

/* um de cada vez, com folga entre eles: quatro players subindo ao mesmo
   tempo numa rede de celular disputam banda e atrasam justo o primeiro, que
   e o unico que a pessoa ve nos proximos segundos */
function aquecePlayers(){
  ORDEM_VIDEOS.forEach(function(chave, i){
    setTimeout(function(){ criaPlayer(chave); }, 400 + i * 2600);
  });
}

/* "listening" faz o iframe mandar o estado de volta. Toda recarga do iframe
   zera isso, entao o aperto de mao roda de novo a cada carga. Enquanto o
   player nao disser que comecou, o play e reenviado: um play mandado antes
   de o iframe estar pronto se perde, e no celular isso deixava o video parado. */
function escuta(pl){
  var n = 0;
  clearInterval(pl.hs);
  pl.hs = setInterval(function(){
    try { pl.iframe.contentWindow.postMessage(JSON.stringify({ event:'listening', id:'yt' }), '*'); } catch(e){}
    mandaPra(pl, 'unloadModule', ['captions']);
    mandaPra(pl, 'unloadModule', ['cc']);
    var parado = pl.estado === undefined || pl.estado === -1 || pl.estado === 5;
    if (videoAtivo === pl && parado && !pl.manual) mandaPra(pl, 'playVideo');
    if (++n > 16) clearInterval(pl.hs);
  }, 500);
  clearInterval(pl.cc);
  pl.cc = setInterval(function(){
    if (videoAtivo !== pl) { clearInterval(pl.cc); return; }
    mandaPra(pl, 'unloadModule', ['captions']);
    mandaPra(pl, 'unloadModule', ['cc']);
  }, 1500);
}

/* iPhone: o som ligado de fora do player pode ser recusado, e o video fica
   parado sem dar para tocar nele. Aqui o player do YouTube volta com o play
   dele a mostra e aceita o toque, que e o gesto que o iPhone exige. */
function modoManual(pl){
  if (pl.manual) return;
  pl.manual = true;
  pl.estado = undefined;
  pl.caixa.classList.add('manual');
  pl.som.classList.add('hide');
  pl.iframe.src = 'https://www.youtube-nocookie.com/embed/' + pl.v.id + '?' +
    PARAMS_VIDEO.replace('mute=1', 'mute=0').replace('controls=0', 'controls=1') + '&autoplay=1&start=0';
  escuta(pl);
  track('VideoManual', { id: pl.v.id });
}

function fimDoVideo(pl){
  if (pl.terminou) return;
  pl.terminou = true;
  if (pl === videoAtivo && state.liberaVideo) state.liberaVideo();
  clearInterval(pl.hs);
  pl.caixa.classList.add('fim');
  elBtnFixo.classList.add('pisca');
  if (!pl.som.classList.contains('hide')) {
    var t = pl.som.querySelector('.faixa span:last-child');
    if (t) t.textContent = 'Toque para ver com som';
  }
  track('VideoFim', { id: pl.v.id });
}

/* Para receber o fim do video nao e preciso carregar a biblioteca do
   YouTube: basta mandar um "listening" pro iframe e ele passa a postar os
   eventos de volta. Quando o playerState vira 0, o video acabou. Se a
   resposta nao vier, nada quebra: o botao Continuar segue funcionando. */
window.addEventListener('message', function(e){
  if (!/youtube/.test(e.origin)) return;
  var d = e.data;
  try { if (typeof d === 'string') d = JSON.parse(d); } catch(err){ return; }
  if (!d) return;
  /* a mensagem pode vir de qualquer um dos quatro players: e.source diz de
     qual, e so o que esta na tela e que manda no botao Continuar */
  var pl = null;
  for (var k in PLAYERS) {
    if (PLAYERS[k].iframe && PLAYERS[k].iframe.contentWindow === e.source) { pl = PLAYERS[k]; break; }
  }
  if (!pl) return;
  var info = d.info;
  /* o player manda o proprio estado de mudo de volta: e por aqui que a
     gente sabe que o unMute pegou e nao precisa recarregar */
  if (info && typeof info === 'object' && info.muted === false) pl.desmutou = true;
  var estado = (info && typeof info === 'object') ? info.playerState : info;
  if (typeof estado === 'number') pl.estado = estado;
  /* tempo e duracao chegam no mesmo infoDelivery: e deles que sai a barrinha */
  if (info && typeof info === 'object') {
    if (info.duration) pl.dur = info.duration;
    if (typeof info.currentTime === 'number' && pl.dur && pl.barra && !SEM_BARRA[pl.chave]) {
      var fr = Math.min(1, info.currentTime / pl.dur);
      pl.caixa.classList.toggle('meio', fr >= .5);
      pl.barra.style.width = (fr * 100).toFixed(1) + '%';
    }
  }
  if (estado === 0 && pl === videoAtivo) fimDoVideo(pl);
});

function telaVideo(p){
  var pl = criaPlayer(p.k);
  var v = VIDEOS[p.k];
  if (!v) { proximo(); return; }

  elTela.innerHTML =
    '<div class="tela-video">' +
    '<h2>' + esc(v.titulo) + '</h2>' +
    /* video sem subtitulo nao deixa um paragrafo vazio ocupando altura */
    (v.texto ? '<p class="peq">' + esc(v.texto) + '</p>' : '') +
    '</div>';

  /* Nenhum link para fora daqui. Levar a pessoa pro YouTube e perder o
     quiz: ela cai no feed e nao volta. Se o video nao carregar, o botao
     Continuar segue funcionando e ela nao trava.
     O Continuar vive na barra fixa do rodape, nao no fim da rolagem: com o
     player alto ele caia atras da barra do navegador no celular. */
  elFixo.classList.remove('hide');
  document.body.classList.add('com-barra');
  document.body.classList.add('tela-de-video');
  elBtnFixo.textContent = 'Continuar';
  elBtnFixo.onclick = proximo;

  if (!pl) { elVideos.classList.add('hide'); return; }

  /* 16/10: o Continuar so libera depois de alguns segundos, com a contagem
     a mostra pra ninguem achar que travou. Se o video acabar antes, libera. */
  state.videosLiberados = state.videosLiberados || {};
  var segura = state.videosLiberados[p.k] ? 0 : (CFG.VIDEO_SEGURA_S || 0);
  clearInterval(state.tSegura);
  state.liberaVideo = function(){
    clearInterval(state.tSegura);
    state.videosLiberados[p.k] = 1;
    elBtnFixo.disabled = false;
    elBtnFixo.textContent = 'Continuar';
  };
  if (segura > 0) {
    elBtnFixo.disabled = true;
    elBtnFixo.textContent = 'Continuar em ' + segura + 's';
    state.tSegura = setInterval(function(){
      segura--;
      if (segura <= 0) state.liberaVideo();
      else elBtnFixo.textContent = 'Continuar em ' + segura + 's';
    }, 1000);
  } else state.liberaVideo();

  elVideos.classList.remove('hide');
  ORDEM_VIDEOS.forEach(function(k){
    if (PLAYERS[k]) PLAYERS[k].caixa.classList.toggle('on', k === p.k);
  });

  /* revendo o mesmo video, ele recomeca do zero e volta a valer a regra do
     fim de video */
  pl.terminou = false;
  pl.caixa.classList.remove('fim');
  pl.som.classList.remove('hide');
  var rot = pl.som.querySelector('.faixa span:last-child');
  if (rot) rot.textContent = 'Toque para ouvir';
  elBtnFixo.classList.remove('pisca');

  videoAtivo = pl;
  if (pl.manual) { pl.som.classList.add('hide'); }
  else { mandaPra(pl, 'seekTo', [0, true]); mandaPra(pl, 'playVideo'); }
  /* cc_load_policy=0 so impede a legenda de vir ligada por padrao; o
     escuta() tambem descarrega o modulo de legenda, que e o que tira de vez */
  escuta(pl);

  /* sair da tela nao destroi o player: ele so pausa e some. Assim a volta
     e instantanea e nada fica tocando escondido gastando dado. */
  state.limpaVideo = function(){
    clearInterval(pl.hs);
    clearTimeout(pl.tSom);
    clearTimeout(pl.tManual);
    clearInterval(state.tSegura);
    clearInterval(pl.cc);
    state.liberaVideo = null;
    elBtnFixo.disabled = false;
    mandaPra(pl, 'pauseVideo');
    pl.caixa.classList.remove('on');
    elVideos.classList.add('hide');
    document.body.classList.remove('tela-de-video');
    elBtnFixo.classList.remove('pisca');
    videoAtivo = null;
  };

  track('VideoView', { id: v.id });
}

   ===================================================================== */
function soDigitos(s){ return String(s).replace(/\D+/g, ''); }
function mascaraTel(s){
  var d = soDigitos(s).slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0,2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
  return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
}
function emailValido(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s).trim()); }

function telaForm(){
  elTela.innerHTML =
    '<span class="selo"><i></i> Última etapa</span>' +

      '<div class="msg">Escreva o seu nome pra personalizar o diagnóstico.</div></div>' +

      '<div class="msg">Escreva um WhatsApp válido, com DDD.</div></div>' +
    '<div class="campo" id="cEmail"><label for="inEmail">Seu e-mail</label>' +
      '<input id="inEmail" type="email" inputmode="email" placeholder="seuemail@exemplo.com" autocomplete="email" value="' + esc(state.email) + '">' +
      '<div class="msg">Escreva um e-mail válido pra receber o plano.</div></div>' +

    '<button class="btn" id="enviar" type="button" style="margin-top:14px">Receber o meu plano</button>' +
    '<p class="privacidade">Leva menos de 10 segundos.</p>';

  var inTel = document.getElementById('inWhats');
  inTel.addEventListener('input', function(){ inTel.value = mascaraTel(inTel.value); });

  document.getElementById('enviar').addEventListener('click', function(){
    var nome  = document.getElementById('inNome').value.trim();
    var whats = soDigitos(inTel.value);
    var email = document.getElementById('inEmail').value.trim();
    var erros = 0;
    function marca(id, ruim){
      document.getElementById(id).classList.toggle('erro', ruim);
      if (ruim) erros++;
    }
    marca('cNome',  nome.length < 2);
    marca('cWhats', whats.length < 10 || whats.length > 11);
    marca('cEmail', !emailValido(email));
    if (erros) { toast('Faltou preencher ' + (erros > 1 ? 'alguns campos' : 'um campo')); return; }

    state.nome = nome; state.whats = whats; state.email = email;
    var s = state.score || computeScores();
    /* o Lead vai uma vez por sessao: dois toques no botao, ou voltar e
       mandar de novo, nao viram dois leads no Pixel */
    var jaFoi = false;
    try { jaFoi = sessionStorage.getItem('qq_lead') === '1'; sessionStorage.setItem('qq_lead', '1'); } catch(e){ jaFoi = !!state.leadFoi; }
    state.leadFoi = true;
    if (!jaFoi) {
      /* correspondencia avancada: o Pixel criptografa antes de enviar */
      if (window.fbq && ok(CFG.META_PIXEL_ID)) {
        try { window.fbq('init', CFG.META_PIXEL_ID, { em: email.toLowerCase(), ph: '55' + whats,
          fn: (nome.split(/\s+/)[0] || '').toLowerCase() }); } catch(e){}
      }
      track('Lead', {
        nome: nome, email: email, whatsapp: whats,
        nivel: s.nivel, geral: s.geral, segmento: s.segmento,
        negocio: state.resp.P11, quando: state.resp.P25,
        respostas: state.resp, multiplas: state.multi
      });
    }
    rastreia('lead', { score: s.geral, nivel: s.nivel, gargalo: (AREAS[s.top] || {}).nome || '',
      contato: { nome: nome, email: email, whatsapp: whats }, utm: UTM });
    enviaCRM('cadastro');
    proximo();
  });
}

function descontoPct(soma){
  if (!soma || !CFG.PRECO_NUM) return 0;
  return Math.max(0, Math.round((1 - CFG.PRECO_NUM / soma) * 100));
}

/* Relogio de 10 minutos. Ele nao fecha nada quando chega a zero: para em
   00:00 e troca o rotulo. Se um dia a oferta tiver de expirar de verdade, e
   aqui que a regra entra, e nao no texto. */
function rodaTimer(){
  var el = document.getElementById('rl');
  if (!el) return;
  var fim = Date.now() + (CFG.TIMER_MIN || 10) * 60000;
  if (state.relogio) clearInterval(state.relogio);
  function passo(){
    var falta = Math.max(0, fim - Date.now());
    var m = Math.floor(falta / 60000), sg = Math.floor(falta % 60000 / 1000);
    el.textContent = m + ':' + (sg < 10 ? '0' : '') + sg;
    if (falta <= 0) {
      clearInterval(state.relogio);
      var lb = el.previousElementSibling;
      if (lb) lb.textContent = 'Última chamada';
    }
  }
  passo();
  state.relogio = setInterval(passo, 1000);
}

/* Funil em fatias separadas, cada uma com respiro entre elas, contorno fino
   e preenchimento que so escurece pro fim. O desenho anterior era um trapezio
   cheio com riscos atravessando: pesado e sem hierarquia. */
var FUNIL = [
  ['Anúncio',          'ele não te conhece'],
  ['Abre o quiz',      'curioso'],
  ['Responde',         'e se qualifica sozinho'],
  ['Deixa o contato',  'você sabe quem ele é'],
  ['Compra',           'cliente']
];

function svgFunil(){
  var L = 340, topo = 18, alturaFatia = 62, respiro = 9;
  var largoTopo = 300, largoBase = 128;
  var n = FUNIL.length;
  var alturaTotal = topo * 2 + n * alturaFatia + (n - 1) * respiro;
  var corpo = '';

  for (var k = 0; k < n; k++) {
    var y = topo + k * (alturaFatia + respiro);
    var a = largoTopo + (largoBase - largoTopo) * (k / n);
    var b = largoTopo + (largoBase - largoTopo) * ((k + 1) / n);
    var x1 = (L - a) / 2, x2 = (L - b) / 2;
    var op = (0.05 + k * 0.045).toFixed(3);
    corpo +=
      '<path d="M' + x1.toFixed(1) + ' ' + y +
        ' H' + (x1 + a).toFixed(1) +
        ' L' + (x2 + b).toFixed(1) + ' ' + (y + alturaFatia) +
        ' H' + x2.toFixed(1) + ' Z" ' +
        'fill="rgba(255,210,0,' + op + ')" stroke="rgba(255,210,0,.34)" stroke-width="1"/>' +
      '<text x="' + (L/2) + '" y="' + (y + 27) + '" text-anchor="middle" ' +
        'font-family="Sora,sans-serif" font-size="14" font-weight="600" fill="#F2F0E6" ' +
        'letter-spacing="-.3">' + esc(FUNIL[k][0]) + '</text>' +
      '<text x="' + (L/2) + '" y="' + (y + 45) + '" text-anchor="middle" ' +
        'font-family="Manrope,sans-serif" font-size="11" fill="#8B968C">' +
        esc(FUNIL[k][1]) + '</text>';
  }

  return '<svg viewBox="0 0 ' + L + ' ' + alturaTotal + '" role="img" ' +
    'aria-label="Funil: do anúncio até a compra">' + corpo + '</svg>';
}

   e fica em Leads de entrada: quem decide é a compra. */
function enviaCRM(evento, extra){
  if (!ok(CFG.LEAD_API) || !/^https?:$/.test(location.protocol)) return;
  var s = state.score || computeScores();
  var corpo = {
    evento: evento, name: state.nome, phone: state.whats, email: state.email,
    porta: 'Quiz do quiz, Perpétuo (porta paga)' + (VERSAO === 'case' ? ', capa do case' : VERSAO === 'direto' ? ', capa direta' : ''),
    temp: 'perpetuo', tag: 'PERPÉTUO · ' + (VERSAO === 'case' ? 'CASE · ' : VERSAO === 'direto' ? 'DIRETO · ' : '') + (s.nivel || ''),
    versao: VERSAO,
    nivel: s.nivel || '', gargalo: (AREAS[s.top] || {}).nome || '',
    utm_source: (UTM && UTM.utm_source) || '', utm_medium: (UTM && UTM.utm_medium) || '',
    utm_campaign: (UTM && UTM.utm_campaign) || '', utm_content: (UTM && UTM.utm_content) || '',
    utm_term: (UTM && UTM.utm_term) || ''
  };
  try { var pf = perfilParaCRM(); for (var c in pf) if (pf[c] !== '') corpo[c] = pf[c]; } catch(e){}
  for (var k in (extra || {})) corpo[k] = extra[k];
  try { fetch(CFG.LEAD_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(corpo), keepalive:true }); } catch(e){}
}
