/* Aviso de saida, so na pagina de oferta. No celular o gatilho e o botao
   VOLTAR, nao o mouse saindo pelo topo: por isso os tres gatilhos juntos. */
var guardaSaida = (function(){
  var armado = false, mostrando = false, liberado = false;

  function dispara(){
    if (!armado || mostrando || liberado || !state.presentes.length) return;
    mostrando = true;
    var cx = document.getElementById('modalCx');
    var nome = primeiroNome();
    cx.innerHTML =
      '<h3>&#9888;&#65039; ' + (nome ? 'Espera, ' + esc(nome) + '. ' : 'Espera. ') +
        'Você ainda não resgatou ' + (state.presentes.length > 1 ? 'os seus ' +
        state.presentes.length + ' presentes' : 'o seu presente') + '</h3>' +
      '<p class="peq">Se você fechar esta página agora, o seu cofre é apagado. ' +
        fmt(somaCofre()) + ' em presentes voltam pra fila, e o plano montado com as ' +
        'suas respostas se perde.</p>' +
      '<button class="btn" id="ficar" type="button">Resgatar os meus presentes</button>' +
      '<button class="btn fantasma" id="sair" type="button">Não quero, prefiro perder</button>';
    document.getElementById('modal').classList.add('on');
    document.getElementById('ficar').addEventListener('click', function(){
      fechaModal(); mostrando = false;
      clicouComprar(state.resp.P25 === 0 ? 'call' : 'compra');
    });
    document.getElementById('sair').addEventListener('click', function(){
      fechaModal(); mostrando = false; liberado = true; desarma();
    });
    track('AvisoDeSaida', { presentes: state.presentes.length });
  }

  function porMouse(e){ if (e.clientY <= 4 && !e.relatedTarget) dispara(); }
  function porVoltar(){ dispara(); try { history.pushState({ qq:1 }, ''); } catch(e){} }
  function porFechar(e){
    if (liberado || !state.presentes.length) return;
    e.preventDefault(); e.returnValue = '';
  }
  function desarma(){
    armado = false;
    document.removeEventListener('mouseout', porMouse);
    window.removeEventListener('popstate', porVoltar);
    window.removeEventListener('beforeunload', porFechar);
  }
  return {
    arma: function(){
      if (armado || liberado) return;
      armado = true;
      document.addEventListener('mouseout', porMouse);
      try { history.pushState({ qq:1 }, ''); } catch(e){}
      window.addEventListener('popstate', porVoltar);
      window.addEventListener('beforeunload', porFechar);
    },
    /* solta assim que a pessoa clica em comprar: atrito no checkout nao serve */
    solta: function(){ liberado = true; desarma(); }
  };
})();

function clicouComprar(tipo){
  guardaSaida.solta();
  rastreia('checkout');
  var s = state.score || computeScores();
  try {
    if (sessionStorage.getItem('qq_click') !== '1') {
      sessionStorage.setItem('qq_click', '1');
      track('InitiateCheckout', { tipo: tipo, segmento: s.segmento });
    }
  } catch(e){ track('InitiateCheckout', { tipo: tipo, segmento: s.segmento }); }

  if (!ok(CFG.CHECKOUT_URL)) { toast('Checkout ainda não configurado.'); return; }
  var u = CFG.CHECKOUT_URL +
    (CFG.CHECKOUT_URL.indexOf('?') > -1 ? '&' : '?') +
    'name='  + encodeURIComponent(state.nome) +
    '&email='+ encodeURIComponent(state.email) +
    '&phone='+ encodeURIComponent(state.whats) +
    (typeof BANDIT !== 'undefined' && BANDIT ? '&src=' + encodeURIComponent(BANDIT.bid) + '&sck=' + encodeURIComponent(BANDIT.bid) : '') +
    /* 16/10: as cinco UTMs do anuncio seguem para a Zouti (antes iam so source
       e campaign, e medium, content e term se perdiam no checkout) */
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].map(function(k){
      return UTM && UTM[k] ? '&' + k + '=' + encodeURIComponent(UTM[k]) : '';
    }).join('');
  enviaCRM('checkout');
  if (CFG.CHECKOUT_MODE === 'popup') window.open(u, '_blank', 'noopener');
  else location.href = u;
}

/* A pagina final aparece por blocos conforme a rolagem, as barras do
   comparativo crescem e o numero sobe junto com elas. */
function animaOferta(){
  var calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var secoes = [].slice.call(elTela.querySelectorAll('.sec'));
  var pilares = [].slice.call(elTela.querySelectorAll('#pilares .pil-i'));
  var etapas  = [].slice.call(elTela.querySelectorAll('#etapas .etapa'));

  function contaAte(el, alvo, dur){
    var t0 = null, pronto = false;
    function passo(ts){
      if (pronto) return;
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      el.textContent = Math.round(alvo * (1 - Math.pow(1 - p, 3))) + '%';
      if (p < 1) requestAnimationFrame(passo); else pronto = true;
    }
    requestAnimationFrame(passo);
    /* rede de seguranca: com a aba em segundo plano o rAF nao roda, e o numero
       ficaria preso no zero. Aqui ele termina no valor certo de qualquer jeito. */
    setTimeout(function(){ if (!pronto){ pronto = true; el.textContent = alvo + '%'; } }, dur + 90);
  }

  function abre(sec){
    if (sec.classList.contains('in')) return;
    sec.classList.add('in');
    [].forEach.call(sec.querySelectorAll('.pil-i'), function(p){ p.classList.add('vis'); });
  }

  /* Cada card do comparativo enche sozinho, quando ELE chega na tela. Antes
     isso vinha junto com a secao, e a secao e tao alta que ja entra no
     primeiro quadro: as barras apareciam cheias e o movimento se perdia. */
  function enche(card){
    if (card.classList.contains('cheio')) return;
    card.classList.add('cheio');
    [].forEach.call(card.querySelectorAll('.cmp-t i'), function(b){
      var pct = parseInt(b.getAttribute('data-pct'), 10) || 0;
      requestAnimationFrame(function(){ b.style.width = pct + '%'; });
    });
    [].forEach.call(card.querySelectorAll('.cmp-v b'), function(n){
      contaAte(n, parseInt(n.getAttribute('data-n'), 10) || 0, 1150);
    });
  }
  var cards = [].slice.call(elTela.querySelectorAll('.cmp-l'));
  if (calmo || !('IntersectionObserver' in window)) {
    cards.forEach(enche);
  } else {
    var obsC = new IntersectionObserver(function(ents){
      ents.forEach(function(e){
        if (!e.isIntersecting) return;
        enche(e.target);
        obsC.unobserve(e.target);
      });
    }, { threshold:.55 });
    cards.forEach(function(c){ obsC.observe(c); });
  }

  if (calmo || !('IntersectionObserver' in window)) {
    secoes.forEach(abre);
    pilares.forEach(function(p){ p.classList.add('vis'); });
    if (calmo) return;
  } else {
    var obs = new IntersectionObserver(function(ents){
      ents.forEach(function(e){
        if (!e.isIntersecting) return;
        abre(e.target);
        obs.unobserve(e.target);
      });
    }, { rootMargin:'0px 0px -6% 0px', threshold:.12 });
    secoes.forEach(function(sc){ obs.observe(sc); });
    /* a primeira dobra nao espera rolagem */
    if (secoes[0]) abre(secoes[0]);
    if (secoes[1]) abre(secoes[1]);
  }

  /* Sem ciclo de destaque: o Carlos pediu pra tirar os movimentos. O que
     sobra de animacao e a entrada de cada bloco na rolagem, que serve pra
     guiar a leitura, e nao pra chamar atencao sozinha. */
  if (state.timers) { state.timers.forEach(clearInterval); state.timers = []; }
}

/* =====================================================================
   11. BOOT
   ===================================================================== */
function boot(){
  state.flow = buildFlow();
  irPara(0);
  track('PageView', {});
  /* os players comecam a subir agora, enquanto a pessoa le a capa: quando
     o primeiro video chegar, ele ja esta pronto na memoria */
  aquecePlayers();
}
boot();

})();
</script>

<script>
/* Rede de fundo da Revolução do Quiz: pontos que descem devagar e se ligam
   como neurônio. 24 quadros por segundo, parada em prefers-reduced-motion,
   congela com a aba escondida. Mesma peça do quiz da Implementação, com a
   cor amarela deste quiz. */
(function () {
  if (!document.body) return;
  var parado = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var cv = document.createElement('canvas');
  cv.className = 'rede'; cv.setAttribute('aria-hidden', 'true');
  document.body.insertBefore(cv, document.body.firstChild);
  var ctx = cv.getContext('2d'); if (!ctx) return;
  var COR = '255,210,0', AREIA = '242,240,230', pts = [], larg = 0, alt = 0, D = 130;
  function medir() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    larg = window.innerWidth; alt = window.innerHeight;
    cv.width = Math.round(larg * dpr); cv.height = Math.round(alt * dpr);
    cv.style.width = larg + 'px'; cv.style.height = alt + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cel = larg < 560; D = cel ? 115 : 140;
    var n = cel ? 32 : 46; pts = [];
    for (var i = 0; i < n; i++) pts.push({ x: Math.random() * larg, y: Math.random() * alt,
      vy: .18 + Math.random() * .42, fase: Math.random() * 6.28, r: 1.1 + Math.random() * 1.6, brilho: Math.random() < .14 });
  }
  function desenhar(t) {
    ctx.clearRect(0, 0, larg, alt);
    var D2 = D * D, i, j, a, b, dx, dy, d2;
    for (i = 0; i < pts.length; i++) { a = pts[i];
      for (j = i + 1; j < pts.length; j++) { b = pts[j]; dx = a.x - b.x; dy = a.y - b.y; d2 = dx * dx + dy * dy;
        if (d2 < D2) { ctx.strokeStyle = 'rgba(' + COR + ',' + (0.26 * (1 - d2 / D2)).toFixed(3) + ')'; ctx.lineWidth = .8;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } } }
    for (i = 0; i < pts.length; i++) { a = pts[i];
      if (a.brilho) { var pulso = .55 + .45 * Math.sin(t / 700 + a.fase);
        ctx.fillStyle = 'rgba(' + COR + ',' + (0.14 * pulso).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r * 5, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = a.brilho ? 'rgba(' + COR + ',.9)' : 'rgba(' + AREIA + ',.5)';
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.28); ctx.fill(); }
  }
  function andar(t) { for (var i = 0; i < pts.length; i++) { var p = pts[i]; p.y += p.vy; p.x += Math.sin(t / 2600 + p.fase) * .18;
    if (p.y > alt + 12) { p.y = -12; p.x = Math.random() * larg; } } }
  var ultimo = 0, rodando = true, INT = 1000 / 24;
  function quadro(t) { requestAnimationFrame(quadro); if (!rodando || t - ultimo < INT) return; ultimo = t; andar(t); desenhar(t); }
  var esp = null;
  window.addEventListener('resize', function () { clearTimeout(esp); esp = setTimeout(function () { medir(); desenhar(0); }, 160); });
  document.addEventListener('visibilitychange', function () { rodando = !document.hidden; ultimo = 0; });
  medir(); desenhar(0); if (!parado) requestAnimationFrame(quadro);
})();
</script>
