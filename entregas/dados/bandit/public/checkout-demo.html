<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout demonstração</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F5FB;color:#111;font-family:system-ui,sans-serif;padding:16px}
.c{background:#fff;border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tag{font-size:12px;background:#FFF4CC;padding:4px 8px;border-radius:6px;display:inline-block}
label{display:flex;gap:8px;margin:14px 0;padding:12px;border:1px dashed #ccc;border-radius:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#22CA88;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
#ok{margin-top:12px;font-size:14px}</style></head>
<body><div class="c"><span class="tag">Checkout de demonstração · simula a Zouti</span>
<h2>A Revolução do Quiz</h2><p>R$ 97,00</p>
<label><input type="checkbox" id="bump"> Order bump: Pacote de prompts (+ R$ 47,00)</label>
<button id="pagar">Pagar (simulação)</button><div id="ok"></div></div>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('pagar').onclick = function(){
  this.disabled = true;
  fetch('/api/demo/comprar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    bump: document.getElementById('bump').checked, email: q.get('email'), phone: q.get('phone'), src: q.get('src'), sck: q.get('sck') }) })
  .then(function(r){ return r.json(); }).then(function(j){
    document.getElementById('ok').textContent = j.ok ? 'Compra aprovada. O webhook chegou no Bandit' + (j.casou ? ' e casou pelo ' + j.degrau + '.' : ', mas não casou com nenhuma visita (vai para Vendas sem braço).') : 'Recusado: ' + (j.erro || '');
  });
};
</script></body></html>
