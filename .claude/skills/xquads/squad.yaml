name: xquads
version: "1.0.0"
short-title: "Xquads Chief"
description: "Meta-orquestrador do Xquads. Porta de entrada única para os 14 squads: recebe a demanda em linguagem natural, diagnostica o domínio, monta o briefing de handoff e ATIVA o chefe do squad correto. Nunca executa o trabalho — apenas identifica e delega."
author: "Synkra AIOS"
license: MIT
slashPrefix: "xquads"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - orchestration
  - meta-orchestrator
  - routing
  - triage
  - delegation
  - entry-point
  - multi-squad

components:
  agents:
    # Tier -1 — Meta-Orquestrador (acima dos chefes de squad)
    - xquads-chief.md
  tasks:
    - diagnose.md
    - route.md
    - review.md
  workflows:
    - wf-route-to-squad.yaml
  checklists:
    - output-quality.md
  data:
    - routing-catalog.yaml

# Squads que este chefe pode ativar (targets de roteamento)
# O nome do squad é também o nome da skill: ative lendo o SKILL.md dele.
# `legacy_command` só vale em instalações do Claude Code via ~/.claude/commands/.
# Em `external`, `command` é a invocação real do sistema externo — não é legado.
routes_to:
  internal:
    - squad: advisory-board
      chief: board-chair
      legacy_command: "/advisory-board:agents:board-chair"
    - squad: brand-squad
      chief: brand-chief
      legacy_command: "/brand-squad:agents:brand-chief"
    - squad: c-level-squad
      chief: vision-chief
      legacy_command: "/c-level-squad:agents:vision-chief"
    - squad: claude-code-mastery
      chief: claude-mastery-chief
      legacy_command: "/claude-code-mastery:agents:claude-mastery-chief"
    - squad: copy-squad
      chief: copy-chief
      legacy_command: "/copy-squad:agents:copy-chief"
    - squad: copy-master
      chief: copy-master-chief
      legacy_command: "/copy-master:agents:copy-master-chief"
    - squad: cybersecurity
      chief: cyber-chief
      legacy_command: "/cybersecurity:agents:cyber-chief"
    - squad: data-squad
      chief: data-chief
      legacy_command: "/data-squad:agents:data-chief"
    - squad: design-squad
      chief: design-chief
      legacy_command: "/design-squad:agents:design-chief"
    - squad: hormozi-squad
      chief: hormozi-chief
      legacy_command: "/hormozi-squad:agents:hormozi-chief"
    - squad: marketing-squad
      chief: marketing-chief
      legacy_command: "/marketing-squad:agents:marketing-chief"
    - squad: movement
      chief: movement-chief
      legacy_command: "/movement:agents:movement-chief"
    - squad: storytelling
      chief: story-chief
      legacy_command: "/storytelling:agents:story-chief"
    - squad: traffic-masters
      chief: traffic-chief
      legacy_command: "/traffic-masters:agents:traffic-chief"
  external:
    - squad: raxos
      chief: raxos
      command: "/raxos"
      note: "Desenvolvimento de software. Fluxo SDC obrigatório — não é squad Xquads."
    - squad: squad-architect
      chief: squad
      command: "/squad"
      note: "Criação de squads/agentes novos. Só quando não existe squad para o domínio."

config:
  extends: extend
