# ---------------------------------------------------------------------------
# Targets externos (não são squads Xquads, mas são destinos legítimos)
# ---------------------------------------------------------------------------
external_targets:

  software_development:
    target: raxos
    command: "/raxos"
    keywords: [código, implementar, bug, feature, refatorar, deploy, api, banco de dados,
               migration, supabase, next.js, react, componente funcional, teste, erro,
               não funciona, corrigir, criar tela, criar rota, integração técnica]
    description: "Desenvolvimento de software. Entra no Story Development Cycle."
    mandatory_flow: true
    note: |
      REGRA CRÍTICA: qualquer alteração de código passa pelo SDC completo
      (@sage criar → @eden validar → @kai implementar → @vera QA → @holt push).
      O Xquads Chief NUNCA escreve código. Roteia para /raxos e sai.
      Exceções (não exigem story): typo <3 linhas, doc, config/.env.

  squad_creation:
    target: squad-architect
    command: "/squad"
    keywords: [criar squad, novo squad, clonar mente, novo agente, time de especialistas,
               não existe squad para, quero um agente de]
    description: "Criar um squad ou agente novo quando nenhum squad existente cobre o domínio."

# ---------------------------------------------------------------------------
# Desambiguação — casos que parecem de um squad mas são de outro
# ---------------------------------------------------------------------------
tie_breakers:

  - situation: "Landing page não converte"
    ask_or_infer: "O problema é o texto, o visual ou o tráfego que chega nela?"
    default: copy-squad
    alternatives: [design-squad, traffic-masters]
    rule: "Texto/argumento → copy-squad. Layout/usabilidade → design-squad. Público errado → traffic-masters."

  - situation: "Quero vender mais"
    ask_or_infer: "Falta oferta, falta tráfego ou falta conversão?"
    default: hormozi-squad
    alternatives: [traffic-masters, copy-squad]
    rule: "Sem oferta clara → hormozi. Oferta boa mas pouca gente vendo → traffic. Muita gente vendo e não compra → copy."

  - situation: "Preciso de um nome/slogan"
    default: brand-squad
    alternatives: [copy-squad]
    rule: "Nome de marca/produto → brand-squad. Headline de campanha → copy-squad."

  - situation: "Preciso de uma apresentação"
    default: storytelling
    alternatives: [c-level-squad, design-squad]
    rule: "Narrativa/pitch → storytelling. Board/investidor → c-level. Só o visual dos slides → design."

  - situation: "Anúncio não performa"
    default: traffic-masters
    alternatives: [copy-squad]
    rule: "Métrica/estrutura/pixel → traffic. Criativo e ângulo → copy (traffic devolve o briefing)."

  - situation: "Quero criar uma comunidade"
    default: movement
    alternatives: [data-squad]
    rule: "Identidade, causa e rituais → movement. Métricas e retenção da comunidade → data-squad."

  - situation: "Devo fazer X ou Y?"
    default: advisory-board
    alternatives: [c-level-squad]
    rule: "Decisão pessoal/existencial → advisory-board. Decisão operacional da empresa → c-level."

  - situation: "Site/app com problema"
    ask_or_infer: "É bug técnico, é experiência ou é segurança?"
    default: raxos
    alternatives: [design-squad, cybersecurity]
    rule: "Quebrado/erro → raxos. Confuso/feio → design. Invadido/exposto → cybersecurity."

# ---------------------------------------------------------------------------
# Cadeias multi-squad — quando a demanda atravessa domínios
# ---------------------------------------------------------------------------
multi_squad_chains:

  lancamento_completo:
    trigger_keywords: [lançamento, lançar produto, lançar curso, launch completo]
    sequence: [brand-squad, hormozi-squad, copy-squad, traffic-masters, data-squad]
    handoff_notes: "Marca define a mensagem → Hormozi estrutura a oferta → Copy escreve → Traffic distribui → Data mede."
    note: "Se o escopo for pequeno, prefira marketing-squad (já é integrado) em vez da cadeia inteira."

  marca_nova:
    trigger_keywords: [criar marca do zero, nova marca, começar do zero]
    sequence: [brand-squad, storytelling, design-squad]
    handoff_notes: "Posicionamento → narrativa → identidade visual."

  produto_novo:
    trigger_keywords: [novo produto, nova oferta, novo infoproduto]
    sequence: [hormozi-squad, copy-squad, traffic-masters]
    handoff_notes: "Oferta → copy de venda → aquisição."

  produto_digital_do_zero:
    trigger_keywords: [criar app, criar plataforma, criar saas]
    sequence: [c-level-squad, design-squad, raxos]
    handoff_notes: "Estratégia/GTM → UX e design system → desenvolvimento no SDC."

  turnaround_de_metrica:
    trigger_keywords: [caiu a conversão, piorou o resultado, métrica despencou]
    sequence: [data-squad, traffic-masters, copy-squad]
    handoff_notes: "Data isola onde caiu → Traffic corrige aquisição → Copy corrige conversão."
