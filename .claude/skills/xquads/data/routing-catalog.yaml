# Routing Catalog: Xquads Chief (Meta-Orquestrador)
# Mapeia demanda em linguagem natural -> squad -> chefe do squad
# Referenciado por: tasks/diagnose.md e tasks/route.md
#
# Keywords em PT-BR primeiro (idioma do usuário), EN como fallback.

meta:
  version: "1.0.0"
  total_squads: 14
  # ATIVAÇÃO — independente de cliente.
  #   `squad`  é também o nome da skill e o nome da pasta. Ative lendo o SKILL.md
  #            dela e seguindo as instruções de ativação que estão lá. Funciona em
  #            Claude Code, Codex, Gemini CLI, Cursor, Copilot, OpenCode e afins.
  #   `legacy_command` é o atalho antigo, válido só em instalações do Claude Code
  #            feitas em ~/.claude/commands/. Use apenas se o cliente for o Claude
  #            Code E o squad estiver instalado por esse caminho.
  # Se o squad não estiver instalado, a rota fica indisponível: avise o usuário,
  # indique `install.sh <squad>` e ofereça a alternativa mais próxima entre as
  # instaladas — nunca finja ter ativado um squad ausente.
  confidence_thresholds:
    high: 80    # roteia direto, sem perguntar
    medium: 50  # roteia declarando a premissa assumida
    low: 0      # faz UMA pergunta de desambiguação

domains:

  copywriting:
    squad: copy-squad
    chief: copy-chief
    legacy_command: "/copy-squad:agents:copy-chief"
    agents: 23
    keywords: [copy, copywriting, headline, título, chamada, carta de vendas, sales letter,
               vsl, script de vídeo, email, sequência de email, bullets, oferta escrita,
               página de vendas, landing page, texto, escrever, persuasão, gatilho mental,
               anúncio, criativo de texto, roteiro de vendas]
    escalate_to: copy-master
    escalate_when: "Projeto grande/complexo, mercado saturado, precisa de negociação, pitch ou SaaS copy"
    description: "Escrever qualquer texto cujo objetivo é vender ou converter."

  copywriting_advanced:
    squad: copy-master
    chief: copy-master-chief
    legacy_command: "/copy-master:agents:copy-master-chief"
    legacy_command_alias: "/Copy-Master:agents:copy-master-chief"  # instalações legadas com pasta capitalizada
    agents: 33
    keywords: [copy master, copy avançado, pitch deck, webinar, negociação, chris voss,
               oren klaff, saas copy, mercado saturado, copy 2.0]
    description: "Versão turbinada do Copy Squad — 33 mestres, inclui persuasão, pitch, negociação e SaaS."

  paid_traffic:
    squad: traffic-masters
    chief: traffic-chief
    legacy_command: "/traffic-masters:agents:traffic-chief"
    agents: 16
    keywords: [tráfego, tráfego pago, anúncio, ads, meta ads, facebook ads, instagram ads,
               google ads, youtube ads, campanha de anúncio, cpa, cpl, roas, cac, escala,
               escalar campanha, media buying, pixel, rastreamento, tracking, gerenciador,
               conjunto de anúncios, verba, budget, otimizar campanha, criativo performou]
    description: "Comprar mídia, escalar, otimizar e rastrear campanhas pagas."

  branding:
    squad: brand-squad
    chief: brand-chief
    legacy_command: "/brand-squad:agents:brand-chief"
    agents: 15
    keywords: [marca, branding, posicionamento, identidade, identidade visual, naming,
               nome da marca, arquétipo, brand equity, arquitetura de marca, tagline,
               slogan, storybrand, diferenciação, reposicionamento, rebrand, propósito da marca]
    description: "Construir, posicionar ou reposicionar uma marca."

  integrated_campaign:
    squad: marketing-squad
    chief: marketing-chief
    legacy_command: "/marketing-squad:agents:marketing-chief"
    agents: 5
    keywords: [campanha, campanha completa, marketing, plano de marketing, mensagem,
               ponta a ponta, mensagem + copy + criativo + tráfego, campanha integrada]
    description: "Campanha de ponta a ponta (mensagem → copy → criativo → tráfego) com time enxuto."
    prefer_when: "Usuário quer UMA campanha completa e não um deliverable isolado."

  offers_and_business:
    squad: hormozi-squad
    chief: hormozi-chief
    legacy_command: "/hormozi-squad:agents:hormozi-chief"
    agents: 16
    keywords: [oferta, grand slam offer, precificação, preço, pricing, ticket, lead,
               geração de leads, core 4, closer, vendas, fechar venda, script de vendas,
               escalar negócio, retenção, churn, ltv, modelo de negócio, monetização,
               faturamento, mrr, workshop, garantia, bônus, value equation]
    description: "Estrutura de oferta, preço, aquisição, vendas e escala do negócio."

  storytelling:
    squad: storytelling
    chief: story-chief
    legacy_command: "/storytelling:agents:story-chief"
    agents: 12
    keywords: [história, storytelling, narrativa, roteiro, jornada do herói, pitch,
               apresentação, palestra, keynote, slides narrativos, manifesto, arco narrativo,
               contar história, travado criativamente, estrutura de roteiro]
    description: "Estruturar narrativa, pitch, apresentação ou manifesto."

  design:
    squad: design-squad
    chief: design-chief
    legacy_command: "/design-squad:agents:design-chief"
    agents: 8
    keywords: [design, ux, ui, interface, design system, componente, atomic design,
               tokens, wireframe, protótipo, fluxo de usuário, usabilidade, acessibilidade,
               handoff, figma, visual, layout, tipografia, identidade de produto]
