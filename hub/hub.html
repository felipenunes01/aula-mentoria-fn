<title>Felipe Nunes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<style>
/* Hub do link da bio: tudo em uma tela. Topo (foto + Instagram) e 3 camadas que dividem o restante da altura. */
:root {
  color-scheme: dark;
  --bg: #020816;
  --text: #f2f5fc;
  --muted: #a7b4d1;
  --ink: #0b0f1a;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(560px 380px at 50% -40px, rgba(10, 79, 255, 0.34), transparent 70%), var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

.hub { max-width: 480px; height: 100%; min-height: 100dvh; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: clamp(18px, 3.5vh, 36px) clamp(16px, 3vh, 28px); display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 22px); }

/* Topo */
.head { display: grid; justify-items: center; gap: clamp(8px, 1.4vh, 12px); flex: none; }
.avatar { width: clamp(92px, 15vh, 126px); aspect-ratio: 1; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, #0a4fff, #52b0ff, #ffffff, #3c8eff, #0a4fff); box-shadow: 0 14px 44px -10px rgba(10, 79, 255, 0.7); max-width: 100%; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 30%; display: block; border: 3px solid var(--bg); background: #000; }
.name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2.6vh, 21px); letter-spacing: 0.01em; text-align: center; }
.role { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.ig { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px 7px 8px; border-radius: 999px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 14.5px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); transition: background 0.2s, border-color 0.2s; }
.ig:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.26); }
.ig:focus-visible { outline: 2px solid #52b0ff; outline-offset: 3px; }
.ig-ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); flex: none; }
.ig-ico svg { width: 16px; height: 16px; }

/* Camadas */
.cards { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.6vh, 14px); max-height: 640px; }
.card { --a1: #0a4fff; --a2: #3c8eff; --deep: #0530b8; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; min-height: 0; border-radius: 20px; overflow: hidden; text-decoration: none; color: var(--text); border: 1px solid rgba(124, 164, 255, 0.24); background: linear-gradient(120deg, #0a1636, #03081a 75%); box-shadow: 0 16px 40px -22px rgba(0, 0, 0, 0.95); transition: transform 0.18s ease, box-shadow 0.2s, border-color 0.2s; }
.card:hover { transform: translateY(-2px); border-color: rgba(124, 164, 255, 0.55); box-shadow: 0 18px 48px -18px rgba(10, 79, 255, 0.55); }
.card:focus-visible { outline: 2px solid #52b0ff; outline-offset: 3px; }
.card--strategy { --a1: #0a4fff; --a2: #3c8eff; --deep: #0530b8; }
.card--expert { --a1: #1568ff; --a2: #52b0ff; --deep: #0a46c4; }

.txt { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: clamp(6px, 1.2vh, 10px); padding: 12px 6px 12px 16px; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #9fc4ff; }
.desc { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 2vh, 16px); line-height: 1.25; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: clamp(36px, 5vh, 42px); padding: 6px 14px; border-radius: 10px; font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; max-width: 100%; text-transform: uppercase; color: #fff; white-space: nowrap; background: linear-gradient(90deg, var(--a1), var(--a2) 60%, var(--deep)); box-shadow: 0 10px 24px -8px rgba(10, 79, 255, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.btn svg { width: 14px; height: 14px; }

.art { position: relative; margin: 6px 6px 6px 0; border-radius: 14px 14px 14px 38px; overflow: hidden; background: #030a22; border: 1px solid rgba(124, 164, 255, 0.16); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card--pld .art img { object-fit: contain; padding: 6% 5%; }

/* PLD: produto de entrada, branco predominante */
.card--pld { --a1: #0a5bff; --a2: #39a8ff; --deep: #0640c9; color: var(--ink); background: linear-gradient(120deg, #ffffff 0%, #f1f5fc 100%); border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 18px 50px -20px rgba(57, 168, 255, 0.55); }
.card--pld:hover { border-color: #fff; box-shadow: 0 20px 56px -18px rgba(57, 168, 255, 0.75); }
.card--pld .tag { color: #0a5bff; }
.card--pld .desc { color: var(--ink); }
.card--pld .desc b { white-space: nowrap; }
.card--pld .art { background: #fff; border-color: rgba(11, 15, 26, 0.08); box-shadow: inset 0 0 0 1px rgba(10, 91, 255, 0.06); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; background: #0d1d45; border: 1px solid rgba(124, 164, 255, 0.32); color: var(--text); padding: 11px 16px; border-radius: 10px; font-size: 14px; transition: opacity 0.25s, transform 0.25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 560px) { .hub { height: auto; } .cards { grid-template-rows: none; grid-auto-rows: 150px; } }
@media (max-width: 360px) { .btn { padding: 6px 10px; font-size: 11.5px; } .txt { padding-left: 12px; } }
@media (prefers-reduced-motion: reduce) { .card, .toast, .ig { transition: none; } }
</style>

<main class="hub">
  <header class="head">
    <div class="avatar"><img src="{{img:foto-felipe}}" alt="Felipe Nunes" width="126" height="126"></div>
    <h1 class="name">Felipe Nunes<span class="role">Mentor e Estrategista</span></h1>
    <a class="ig" id="ig" href="https://instagram.com/eusoufelipenunes" target="_blank" rel="noopener">
      <span class="ig-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff" stroke="none"/></svg></span>
      <span id="handle">@eusoufelipenunes</span>
    </a>
  </header>

  <nav class="cards" aria-label="Programas">
    <a class="card card--pld" data-produto="pld">
      <div class="txt">
        <span class="tag">Comece por aqui</span>
        <span class="desc">Formação de entrada · <b>R$ 197</b></span>
        <span class="btn">Saiba mais <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
      </div>
      <div class="art"><img src="{{img:logo-pld-preto}}" alt="PLD, Profissão Lançador Digital"></div>
    </a>

    <a class="card card--strategy" data-produto="estrategistas">
      <div class="txt">
        <span class="tag">Mentoria em grupo</span>
        <span class="desc">Para estrategistas do digital</span>
        <span class="btn">Saiba mais <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
      </div>
      <div class="art"><img src="{{img:card-strategy}}" alt="FN Strategy, Mentoria para Estrategistas"></div>
    </a>

    <a class="card card--expert" data-produto="mentores">
      <div class="txt">
        <span class="tag">Mentoria individual</span>
        <span class="desc">Para experts e especialistas</span>
        <span class="btn">Saiba mais <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
      </div>
      <div class="art"><img src="{{img:card-expert}}" alt="FN Expert, Mentoria para Especialistas"></div>
    </a>
  </nav>
</main>

<script>
/* ===== CONFIGURAÇÃO DO HUB: troque só aqui ===== */
var HUB = {
  instagram: "https://instagram.com/eusoufelipenunes",
  links: {         // site externo de cada produto
    pld: "",
    estrategistas: "",
    mentores: ""
  }
};

(function () {
  document.getElementById("ig").href = HUB.instagram;
  var toast;
  function aviso(msg) {
    if (!toast) { toast = document.createElement("div"); toast.className = "toast"; toast.setAttribute("role", "status"); document.body.appendChild(toast); }
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { toast.classList.remove("show"); }, 3000);
  }
  window.dataLayer = window.dataLayer || [];
  document.getElementById("ig").addEventListener("click", function () { window.dataLayer.push({ event: "clique_instagram" }); });
  document.querySelectorAll("[data-produto]").forEach(function (a) {
    var key = a.getAttribute("data-produto"), url = HUB.links[key];
    if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener"; }
    else { a.href = "#"; }
    a.addEventListener("click", function (e) {
      window.dataLayer.push({ event: "clique_hub", produto: key });
      if (!url) { e.preventDefault(); aviso("Link em configuração."); }
    });
  });
})();
</script>
